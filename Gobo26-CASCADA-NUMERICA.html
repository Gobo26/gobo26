<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobo26 - Cascada Numèrica</title>
<meta name="description" content="Cascada Numèrica: joc gratuït de seqüències i càlcul mental per entrenar atenció i agilitat numèrica.">
<meta name="theme-color" content="#1e293b">
    <style>
        :root {
            --bg:      #f1f5f9;
            --text:    #334155;
            --s800:    #1e293b;
            --s700:    #334155;
            --s400:    #94a3b8;
            --s200:    #e2e8f0;
            --blue:    #2563eb;
            --green:   #16a34a;
            --red:     #dc2626;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            width: 100%; background: var(--s800); border-bottom: 1px solid #334155;
            padding: 10px 16px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 50; flex-shrink: 0;
        }
        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-txt { font-size: .9rem; font-weight: 900; color: white; letter-spacing: -.5px; }
        .logo-txt span { color: #3b82f6; }
        .hdr-title { font-size: .95rem; font-weight: 700; color: white; letter-spacing: .5px; }

        /* ── MAIN ── */
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        #app {
            width: 100%; max-width: 900px; padding: 14px 12px;
            display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1;
        }

        /* ── MENU ── */
        .menu-title {
            font-size: clamp(1.5rem, 6vw, 2.4rem); font-weight: 900;
            color: var(--s800); text-align: center;
        }
        .frase {
            color: #64748b; font-style: italic; font-size: .85rem;
            text-align: center; padding: 0 12px; line-height: 1.5;
        }
        .menu-card {
            background: white; border-radius: 16px; padding: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08); border: 1px solid var(--s200);
            width: 100%; max-width: 500px;
        }
        .menu-card-cap {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
        }
        .menu-card-cap h2 { font-size: .95rem; font-weight: 700; color: #64748b; }
        .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media (min-width: 420px) { .level-grid { grid-template-columns: 1fr 1fr 1fr; } }

        .level-btn {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 13px; border-radius: 11px; border: 2px solid;
            background: none; cursor: pointer;
            font-family: system-ui, -apple-system, sans-serif;
            transition: transform .15s, box-shadow .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .level-btn:hover  { transform: scale(1.03); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .level-btn:active { transform: scale(.97); }
        .lbl { font-weight: 800; font-size: .9rem; display: block; }
        .sub { font-size: .68rem; opacity: .7; display: block; }
        .record-pill {
            font-size: .72rem; font-weight: 700; font-variant-numeric: tabular-nums;
            background: rgba(255,255,255,.75); padding: 2px 8px; border-radius: 99px;
            color: #475569; display: flex; align-items: center; gap: 3px; flex-shrink: 0;
        }

        /* colors de nivell */
        .lc-4  { background:#f0fdf4; border-color:#86efac; color:#166534; }
        .lc-5  { background:#f0fdfa; border-color:#5eead4; color:#134e4a; }
        .lc-6  { background:#eff6ff; border-color:#93c5fd; color:#1e40af; }
        .lc-7  { background:#eef2ff; border-color:#a5b4fc; color:#3730a3; }
        .lc-8  { background:#faf5ff; border-color:#d8b4fe; color:#6b21a8; }
        .lc-9  { background:#fdf2f8; border-color:#f0abfc; color:#86198f; }
        .lc-10 { background:#fff1f2; border-color:#fca5a5; color:#991b1b; }

        /* ── CAPÇALERA DEL JOC ── */
        .game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; }
        .game-title-area { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .btn-icon {
            background: none; border: none; cursor: pointer; padding: 7px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background .15s; color: #475569; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-icon:hover { background: white; }
        .game-title { font-size: 1rem; font-weight: 800; color: var(--s800); white-space: nowrap; }
        .game-sublabel {
            font-size: .65rem; font-weight: 700; padding: 2px 8px;
            border-radius: 99px; border: 2px solid; white-space: nowrap;
        }
        .game-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .btn-sec {
            display: flex; align-items: center; gap: 4px;
            background: white; border: 1px solid #cbd5e1; padding: 7px 11px;
            border-radius: 8px; cursor: pointer;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: .78rem; font-weight: 700; color: #334155;
            transition: background .15s; -webkit-tap-highlight-color: transparent;
        }
        .btn-sec:hover { background: var(--s200); }
        .btn-pri {
            display: flex; align-items: center; gap: 4px;
            background: var(--s800); border: none; padding: 7px 13px;
            border-radius: 8px; cursor: pointer;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: .78rem; font-weight: 700; color: white;
            transition: background .15s; -webkit-tap-highlight-color: transparent;
        }
        .btn-pri:hover { background: var(--s700); }

        /* ── ESTADÍSTIQUES ── */
        .stats-row { display: flex; gap: 8px; justify-content: center; width: 100%; }
        .stat-box {
            background: white; border-radius: 10px; padding: 7px 16px;
            text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06);
            border: 1px solid var(--s200);
        }
        .stat-box.principal { border: 2px solid var(--s800); }
        .stat-label { font-size: .58rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--s400); }
        .stat-value { font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--s800); line-height: 1.2; }

        /* ── MISSATGE ── */
        .message-bar {
            padding: 9px 20px; border-radius: 99px; text-align: center;
            font-weight: 600; font-size: .83rem; width: 100%; max-width: 480px;
            transition: background .3s, color .3s;
        }
        .msg-neutral { background: white; color: #475569; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .msg-target  { background: var(--blue); color: white; }
        .msg-win     { background: var(--green); color: white; }

        /* ── BANNER RÈCORD ── */
        .record-banner {
            width: 100%; max-width: 480px;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            color: #7c2d12; padding: 11px 20px; border-radius: 14px;
            font-size: 1.1rem; font-weight: 900; text-align: center;
            box-shadow: 0 4px 16px rgba(249,115,22,.3);
        }

        /* ── GRAELLA ── */
        .grid-wrap {
            background: white; border-radius: 16px; padding: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08); border: 1px solid var(--s200);
            width: 100%; overflow-x: auto;
        }
        .game-grid { display: grid; gap: 5px; justify-content: center; margin: 0 auto; }
        @media (min-width: 480px) { .game-grid { gap: 7px; } }

        /* ── CEL·LA ── */
        .cell {
            width: 42px; height: 42px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem; font-weight: 800; border: 2px solid;
            cursor: pointer; transition: transform .12s;
            position: relative; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, sans-serif;
        }
        @media (min-width: 380px) { .cell { width: 46px; height: 46px; } }
        @media (min-width: 480px) { .cell { width: 52px; height: 52px; font-size: 1.25rem; } }
        @media (min-width: 640px) { .cell { width: 58px; height: 58px; font-size: 1.4rem; } }

        .cell:active { transform: scale(.9); }
        .cell.no-clic { cursor: default; pointer-events: none; }

        /* Estat: amagada */
        .cell.hidden { background: #e2e8f0; border-color: #cbd5e1; }
        .cell.hidden:hover { background: #cbd5e1; }
        .cell.hidden .cell-num { opacity: 0; }
        .cell.hidden .cell-spark { opacity: .45; }
        .cell-spark { position: absolute; font-size: .85em; color: #94a3b8; opacity: 0; }

        /* Estat: resolta */
        .cell.solved { background: #dcfce7; border-color: #86efac; color: #166534; cursor: default; }
        .cell.solved .cell-spark { display: none; }

        /* Colors quan visible */
        .cell.visible.num-1  { background:#fef08a; border-color:#facc15; color:#854d0e; }
        .cell.visible.num-2  { background:#bfdbfe; border-color:#60a5fa; color:#1e40af; }
        .cell.visible.num-3  { background:#bbf7d0; border-color:#4ade80; color:#166534; }
        .cell.visible.num-4  { background:#fecaca; border-color:#f87171; color:#991b1b; }
        .cell.visible.num-5  { background:#fed7aa; border-color:#fb923c; color:#9a3412; }
        .cell.visible.num-6  { background:#e9d5ff; border-color:#c084fc; color:#6b21a8; }
        .cell.visible.num-7  { background:#99f6e4; border-color:#2dd4bf; color:#134e4a; }
        .cell.visible.num-8  { background:#fbcfe8; border-color:#f472b6; color:#9d174d; }
        .cell.visible.num-9  { background:#fda4af; border-color:#fb7185; color:#881337; }
        .cell.visible.num-10 { background:#cbd5e1; border-color:#94a3b8; color:#334155; }
        .cell.visible .cell-spark { display: none; }

        /* Animacions */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-8px); }
            75%      { transform: translateX(8px); }
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50%      { transform: scale(1.06); }
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.85); }
            to   { opacity: 1; transform: scale(1); }
        }
        .cell.error-anim  { animation: shake .3s ease-in-out; background: #ef4444 !important; border-color: #b91c1c !important; color: white !important; }
        .cell.fi-pulse    { animation: pulse 1.2s ease-in-out infinite; }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.55);
            z-index: 100; display: flex; align-items: center;
            justify-content: center; padding: 16px;
        }
        .modal-box {
            background: white; border-radius: 20px; padding: 22px 18px 18px;
            max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25);
            animation: popIn .25s ease; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title  { font-size: 1rem; font-weight: 800; color: var(--s800); }
        .btn-close    { background: none; border: none; cursor: pointer; color: var(--s400); font-size: 1.3rem; line-height: 1; padding: 4px; }
        .btn-close:hover { color: var(--text); }
        .modal-cos    { color: #475569; font-size: .85rem; display: flex; flex-direction: column; gap: 12px; }
        .rule-item    { display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }
        .rule-num     { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .82rem; flex-shrink: 0; margin-top: 1px; }
        .rn-blue { background: #dbeafe; color: #1d4ed8; }
        .rn-red  { background: #fee2e2; color: var(--red); }
        .btn-ok {
            margin-top: 14px; width: 100%; background: var(--s800); color: white;
            border: none; border-radius: 10px; padding: 11px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: .9rem; font-weight: 700; cursor: pointer;
        }
        .btn-ok:hover { background: var(--s700); }

        /* ── CONFETI ── */
        .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
        .confetti-p    { position: absolute; top: -20px; animation: fall linear forwards; }

        /* ── FOOTER ── */
        footer {
            background: var(--s800); border-top: 1px solid #1e2d45;
            color: var(--s400); text-align: center; padding: 10px;
            font-size: .65rem; font-weight: 600; flex-shrink: 0;
        }
        footer a {
            color: var(--s400); text-decoration: none; opacity: .4;
            display: inline-flex; align-items: center; gap: 5px; transition: opacity .2s;
        }
        footer a:hover { opacity: .8; }
    </style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const NIVELLS = {
    4:  { label: 'Bàsic',      colsD: 5,  colsM: 2 },
    5:  { label: 'Inicial',    colsD: 5,  colsM: 3 },
    6:  { label: 'Normal',     colsD: 7,  colsM: 3 },
    7:  { label: 'Difícil',    colsD: 7,  colsM: 4 },
    8:  { label: 'Avançat',    colsD: 6,  colsM: 6 },
    9:  { label: 'Complexe',   colsD: 9,  colsM: 5 },
    10: { label: 'Impossible', colsD: 11, colsM: 5 },
};

const FRASES = [
    "La paciència és l'art de saber esperar amb un somriure.",
    "Avui és un dia perfecte per superar-se a un mateix.",
    "No comptis els dies, fes que els dies comptin.",
    "L'error és només una oportunitat per començar de nou.",
    "La constància és el pont entre el desig i la realitat.",
    "Si caus set vegades, aixeca't vuit.",
    "La felicitat es troba en les petites victòries de cada dia.",
    "Més val maña que força... sobretot en matemàtiques!",
    "Respira fons i gaudeix del joc, sense pressa.",
    "El millor mestre és el teu darrer error.",
    "No tot ha de sortir perfecte perquè valgui la pena.",
    "Avui també és un bon dia per fer-ho una mica millor.",
    "La calma també és una forma de valentia.",
    "Fer les coses a la teva manera també és avançar.",
    "El teu ritme també és un ritme vàlid.",
    "De vegades descansar és la millor decisió del dia.",
];

// ── ESTAT ─────────────────────────────────────────────────────────────────────
let estat        = 'menu';   // 'menu' | 'jugant' | 'acabat'
let nivell       = 6;
let grid         = [];       // [{id, value, status:'hidden'|'visible'|'solved'}]
let clics        = 0;
let objectiu     = null;     // número que estem buscant
let processant   = false;
let missatge     = '';
let records      = {};
let nouRecord    = false;
let errorIdx     = null;
let frase        = '';

// ── PERSISTÈNCIA ──────────────────────────────────────────────────────────────
function carregarRecords() {
    try { records = JSON.parse(localStorage.getItem('cascadaScores') || '{}'); }
    catch(e) { records = {}; }
    let canvi = false;
    Object.keys(NIVELLS).forEach(n => {
        const nv = parseInt(n);
        if (!records[nv]) {
            const total = (nv * (nv + 1)) / 2;
            records[nv] = total + Math.floor(Math.random() * 16) + 15;
            canvi = true;
        }
    });
    if (canvi) guardarRecords();
}

function guardarRecords() {
    try { localStorage.setItem('cascadaScores', JSON.stringify(records)); } catch(e) {}
}

// ── SO I VIBRACIÓ ─────────────────────────────────────────────────────────────
function vibrar(p) { if (navigator.vibrate) navigator.vibrate(p); }

function so(tipus) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx  = new AC();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const t = ctx.currentTime;
    if (tipus === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(400, t + .08);
        gain.gain.setValueAtTime(.08, t);
        gain.gain.exponentialRampToValueAtTime(.01, t + .08);
        osc.start(t); osc.stop(t + .08); vibrar(8);
    } else if (tipus === 'match') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, t);
        osc.frequency.linearRampToValueAtTime(700, t + .12);
        gain.gain.setValueAtTime(.1, t);
        gain.gain.linearRampToValueAtTime(.01, t + .25);
        osc.start(t); osc.stop(t + .25); vibrar(15);
    } else if (tipus === 'solved') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.setValueAtTime(800, t + .1);
        osc.frequency.setValueAtTime(1000, t + .2);
        gain.gain.setValueAtTime(.12, t);
        gain.gain.linearRampToValueAtTime(.01, t + .5);
        osc.start(t); osc.stop(t + .5); vibrar([25, 40, 25]);
    } else if (tipus === 'error') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + .1);
        gain.gain.setValueAtTime(.05, t);
        gain.gain.exponentialRampToValueAtTime(.01, t + .1);
        osc.start(t); osc.stop(t + .1); vibrar([40, 20, 40]);
    } else if (tipus === 'nouRecord') {
        osc.type = 'triangle';
        [500, 600, 700, 900].forEach((f, i) => osc.frequency.setValueAtTime(f, t + i * .1));
        gain.gain.setValueAtTime(.15, t);
        gain.gain.linearRampToValueAtTime(.01, t + .8);
        osc.start(t); osc.stop(t + .8); vibrar([80, 40, 80, 40, 150]);
    }
}

// ── LÒGICA DEL JOC ────────────────────────────────────────────────────────────
function iniciarPartida(nv) {
    nivell    = nv;
    frase     = FRASES[Math.floor(Math.random() * FRASES.length)];
    clics     = 0;
    objectiu  = null;
    processant = false;
    nouRecord = false;
    errorIdx  = null;
    estat     = 'jugant';
    missatge  = 'Clica una casella per començar!';

    // Generar números: N còpies de cada número de 1 a N
    const nums = [];
    for (let i = 1; i <= nv; i++)
        for (let j = 0; j < i; j++)
            nums.push(i);

    // Barreja Fisher-Yates
    for (let i = nums.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nums[i], nums[j]] = [nums[j], nums[i]];
    }

    grid = nums.map((val, id) => ({ id, value: val, status: 'hidden' }));
    render();
}

function clicarCel·la(idx) {
    if (processant || estat !== 'jugant') return;
    const carta = grid[idx];
    if (carta.status !== 'hidden') return;

    so('pop');
    clics++;
    carta.status = 'visible';
    errorIdx = null;

    if (objectiu === null) {
        if (carta.value === 1) {
            so('solved');
            carta.status = 'solved';
            missatge = "L'u trobat! Continua.";
            comprovarVictoria();
        } else {
            objectiu = carta.value;
            missatge = `Busca els ${carta.value}! En falten ${carta.value - 1}.`;
            render();
        }
    } else if (carta.value === objectiu) {
        const visibles = grid.filter(c => c.value === objectiu && c.status === 'visible');
        if (visibles.length === objectiu) {
            so('solved');
            grid.forEach(c => { if (c.value === objectiu) c.status = 'solved'; });
            missatge = `Perfecte! Has trobat tots els ${objectiu}.`;
            objectiu = null;
            comprovarVictoria();
        } else {
            so('match');
            const falten = objectiu - visibles.length;
            missatge = `Bé! Falten ${falten} número${falten > 1 ? 's' : ''} ${objectiu}.`;
            render();
        }
    } else {
        // Error: número incorrecte
        so('error');
        processant = true;
        errorIdx = idx;
        const tn = objectiu;
        missatge = `Ups! És un ${carta.value}. Es reinicia la sèrie del ${tn}.`;
        render();
        setTimeout(() => {
            grid.forEach(c => {
                if (c.id === idx) c.status = 'hidden';
                else if (c.value === tn && c.status === 'visible') c.status = 'hidden';
            });
            objectiu   = null;
            processant = false;
            errorIdx   = null;
            missatge   = 'Torna-hi! Busca una nova parella.';
            render();
        }, 800);
    }
}

function comprovarVictoria() {
    if (!grid.every(c => c.status === 'solved')) { render(); return; }
    estat = 'acabat';
    if (clics < records[nivell]) {
        nouRecord = true;
        records[nivell] = clics;
        guardarRecords();
        so('nouRecord');
        missatge = 'INCREÏBLE! NOU RÈCORD ACONSEGUIT!';
    } else {
        so('solved');
        missatge = 'FELICITATS! Has completat la cascada!';
    }
    render();
    llençarConfeti();
}

// ── CONFETI ───────────────────────────────────────────────────────────────────
function llençarConfeti() {
    let wrap = document.getElementById('confeti-wrap');
    if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = 'confeti-wrap';
        wrap.className = 'confetti-wrap';
        document.body.appendChild(wrap);
    }
    wrap.innerHTML = '';
    const colors = ['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed','#ec4899'];
    for (let i = 0; i < 50; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-p';
        p.style.left     = Math.random() * 100 + 'vw';
        const mida       = 6 + Math.random() * 8;
        p.style.width    = mida + 'px';
        p.style.height   = mida + 'px';
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.borderRadius    = Math.random() > .5 ? '50%' : '2px';
        p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        p.style.animationDelay    = Math.random() * .6 + 's';
        wrap.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
    }
}

// ── MODAL DE REGLES ───────────────────────────────────────────────────────────
function obriRegles() {
    if (document.getElementById('modal-regles')) return;
    const overlay = document.createElement('div');
    overlay.id = 'modal-regles';
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target === overlay) tancarRegles(); };
    overlay.innerHTML = `
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">❓ Com jugar</div>
                <button type="button" class="btn-close" onclick="tancarRegles()">✕</button>
            </div>
            <div class="modal-cos">
                <div class="rule-item">
                    <div class="rule-num rn-blue">1</div>
                    <p><strong>Objectiu:</strong> Destapa totes les caselles de la graella.</p>
                </div>
                <div class="rule-item">
                    <div class="rule-num rn-blue">2</div>
                    <p><strong>La Regla d'Or:</strong> Quan trobes un número (ex. un <strong>3</strong>), has de trobar els altres dos 3s <strong>de forma consecutiva</strong>.</p>
                </div>
                <div class="rule-item">
                    <div class="rule-num rn-red">!</div>
                    <p><strong>Compte!</strong> Si cliques un número incorrecte, tots els de la sèrie activa es tornen a amagar.</p>
                </div>
                <div class="rule-item">
                    <div class="rule-num rn-blue">3</div>
                    <p>El número <strong>1</strong> es resol sol. El número <strong>9</strong> requereix 9 encerts seguits!</p>
                </div>
            </div>
            <button type="button" class="btn-ok" onclick="tancarRegles()">Entesos!</button>
        </div>`;
    document.body.appendChild(overlay);
}

function tancarRegles() {
    const m = document.getElementById('modal-regles');
    if (m) m.remove();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function esMobil() { return window.innerWidth < 600; }

function getCols() {
    const cfg = NIVELLS[nivell];
    return esMobil() ? cfg.colsM : cfg.colsD;
}

function render() {
    const app = document.getElementById('app');
    app.innerHTML = estat === 'menu' ? htmlMenu() : htmlJoc();
}

function htmlMenu() {
    const botons = [4, 5, 6, 7, 8, 9, 10].map(n => `
        <button type="button" class="level-btn lc-${n}" onclick="iniciarPartida(${n})">
            <div>
                <span class="lbl">${NIVELLS[n].label}</span>
                <span class="sub">Nivell ${n}</span>
            </div>
            <div class="record-pill">🏆 ${records[n] !== undefined ? records[n] : '—'}</div>
        </button>`).join('');

    return `
        <h1 class="menu-title">Cascada Numèrica</h1>
        <p class="frase">«${frase}»</p>
        <div class="menu-card">
            <div class="menu-card-cap">
                <h2>Tria el teu repte:</h2>
                <button type="button" class="btn-icon" onclick="obriRegles()" title="Com jugar" style="font-size:1.1rem;color:#64748b">❓</button>
            </div>
            <div class="level-grid">${botons}</div>
        </div>`;
}

function htmlJoc() {
    const cfg     = NIVELLS[nivell];
    const cols    = getCols();
    const msgCls  = estat === 'acabat' ? 'msg-win' : objectiu ? 'msg-target' : 'msg-neutral';

    const cel·les = grid.map((c, i) => {
        const esError  = errorIdx === i;
        const esPulse  = estat === 'acabat' && c.status === 'solved';
        const noClic   = c.status === 'solved' || (c.status === 'visible' && c.value !== objectiu);
        let cls = `cell ${c.status} num-${c.value}`;
        if (esError) cls += ' error-anim';
        if (esPulse) cls += ' fi-pulse';
        if (noClic)  cls += ' no-clic';
        const delay = esPulse ? i * 50 : 0;
        return `<button type="button" class="${cls}" onclick="clicarCel·la(${i})" style="animation-delay:${delay}ms">
            <span class="cell-spark">✦</span>
            <span class="cell-num">${c.value}</span>
        </button>`;
    }).join('');

    const bannerRecord = nouRecord
        ? `<div class="record-banner">👑 NOU RÈCORD! 👑</div>`
        : '';

    const btnMenu = estat === 'acabat'
        ? `<button type="button" class="btn-sec" onclick="tornarMenu()">🏠 Menú</button>`
        : '';

    return `
        <div class="game-header">
            <div class="game-title-area">
                <button type="button" class="btn-icon" onclick="tornarMenu()" title="Menú">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                </button>
                <div>
                    <div class="game-title">Cascada Numèrica</div>
                    <span class="game-sublabel lc-${nivell}">${cfg.label}</span>
                </div>
                <button type="button" class="btn-icon" onclick="obriRegles()" title="Ajuda" style="font-size:1rem;color:#94a3b8">❓</button>
            </div>
            <div class="game-actions">
                ${btnMenu}
                <button type="button" class="btn-pri" onclick="iniciarPartida(${nivell})">
                    ↺ ${estat === 'acabat' ? 'Altra' : 'Reiniciar'}
                </button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-label">🏆 Rècord</div>
                <div class="stat-value">${records[nivell]}</div>
            </div>
            <div class="stat-box principal">
                <div class="stat-label">Clics</div>
                <div class="stat-value">${clics}</div>
            </div>
        </div>

        ${bannerRecord}
        <div class="message-bar ${msgCls}">${missatge}</div>

        <div class="grid-wrap">
            <div class="game-grid" style="grid-template-columns:repeat(${cols},1fr)">
                ${cel·les}
            </div>
        </div>

        <p class="frase" style="font-size:.78rem">«${frase}»</p>`;
}

function tornarMenu() {
    estat = 'menu';
    render();
}

// Redibixar la graella en rotar el mòbil
window.addEventListener('resize', () => {
    if (estat !== 'menu') render();
});

// ── ARRENCADA ─────────────────────────────────────────────────────────────────
carregarRecords();
frase = FRASES[Math.floor(Math.random() * FRASES.length)];
render();
</script>
</body>
