<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gobo26 - Sudoku</title>
<meta name="description" content="Sudoku gratuït de Gobo26 amb diversos nivells de dificultat per entrenar lògica i concentració.">
<meta name="theme-color" content="#1e293b">
    <style>
        :root {
            --bg:         #f1f5f9;
            --board-bg:   #ffffff;
            --text:       #334155;
            --text-fixed: #1e293b;
            --text-user:  #2563eb;
            --text-error: #dc2626;
            --line-thin:  #94a3b8;
            --line-thick: #475569;
            --cell-hover: #e2e8f0;
            --cell-sel:   #bfdbfe;
            --cell-fixed: #f8fafc;
            --cell-error: #fee2e2;
            --cell-same:  #dbeafe;
            --cell-notes: #f0fdf4;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header { width:100%; background:#1e293b; border-bottom:1px solid #334155;
                 padding:10px 16px; display:flex; align-items:center;
                 justify-content:space-between; position:sticky; top:0; z-index:50; flex-shrink:0; }
        .logo { display:flex; align-items:center; gap:8px; text-decoration:none; }
        .logo-txt { font-size:.9rem; font-weight:900; color:white; letter-spacing:-.5px; }
        .logo-txt span { color:#3b82f6; }
        .hdr-title { font-size:.95rem; font-weight:700; color:white; letter-spacing:.5px; }

        /* TIMER */
        #timer-display {
            font-size: 1rem;
            font-weight: 800;
            color: #93c5fd;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            min-width: 58px;
            text-align: right;
        }

        /* MAIN: ocupa tot l'espai restant */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            overflow: hidden;
            gap: 4px;
        }

        /* BOTONS DE DIFICULTAT */
        .controls {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
            width: 100%;
            max-width: 420px;
        }

        .controls button {
            flex: 1;
            padding: 6px 4px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            background: white;
            color: var(--text);
            cursor: pointer;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            transition: all 0.2s;
        }
        .controls button:hover { background: #e2e8f0; }
        .controls button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }
        .controls button.primary:hover { background: #1d4ed8; }
        .controls button.active-diff {
            background: #1e293b;
            border-color: #1e293b;
            color: white;
        }

        /* TOOLBAR: desfer, notes, pista */
        .toolbar {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
            width: 100%;
            max-width: 420px;
        }
        .tool-btn {
            flex: 1;
            padding: 6px 4px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            background: white;
            color: var(--text);
            cursor: pointer;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .tool-btn:hover { background: #e2e8f0; }
        .tool-btn.notes-on {
            background: #dcfce7;
            border-color: #16a34a;
            color: #15803d;
        }
        .tool-btn:disabled { opacity: 0.4; cursor: default; }

        /* TAULELL */
        .game-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            background: var(--line-thick);
            border: 2px solid var(--line-thick);
            border-radius: 4px;
            gap: 0;
            width: min(92vw, 92vw);
            height: min(92vw, 92vw);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            flex-shrink: 1;
            max-width: 440px;
            max-height: 440px;
        }

        .cell {
            background: var(--board-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
            border-right:  1px solid var(--line-thin);
            border-bottom: 1px solid var(--line-thin);
            font-size: clamp(14px, 5vw, 26px);
            position: relative;
            overflow: hidden;
        }

        .cell:nth-child(9n)   { border-right: none; }
        .cell:nth-child(n+73) { border-bottom: none; }

        .cell.right-thick  { border-right:  2px solid var(--line-thick); }
        .cell.bottom-thick { border-bottom: 2px solid var(--line-thick); }

        .cell:hover    { background: var(--cell-hover); }
        .cell.fixed    { background: var(--cell-fixed); color: var(--text-fixed); cursor: default; }
        .cell.fixed:hover { background: var(--cell-fixed); }
        .cell.selected { background: var(--cell-sel) !important; }
        .cell.same-num { background: var(--cell-same); }
        .cell.user-input { color: var(--text-user); }
        .cell.error    { background: var(--cell-error) !important; color: var(--text-error); }

        /* NOTES (mini números) */
        .cell.has-notes { font-size: 0; }
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
        }
        .note-num {
            font-size: clamp(7px, 2.5vw, 13px);
            font-weight: 700;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* MISSATGE */
        .status {
            font-size: 0.72rem;
            font-weight: 700;
            height: 1em;
            color: #475569;
            text-align: center;
            flex-shrink: 0;
        }

        /* TECLAT NUMÈRIC */
        .numpad {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 420px;
            flex-shrink: 0;
        }

        .num-btn {
            padding: 10px 0;
            min-height: 44px;
            background: white;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: clamp(14px, 4vw, 20px);
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
        }
        .num-btn:hover { background: #e2e8f0; }
        .num-btn.del { background: #fee2e2; border-color: #fca5a5; color: #dc2626; font-size: clamp(12px, 3.5vw, 18px); }
        .num-btn.del:hover { background: #fecaca; }
        .num-btn.notes-mode { background: #dcfce7; border-color: #86efac; color: #15803d; }

        /* FOOTER */
        footer {
            background: #1e293b;
            border-top: 1px solid #334155;
            color: #64748b;
            text-align: center;
            padding: 5px;
            font-size: 10px;
            flex-shrink: 0;
        }
        footer a {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            opacity: 0.4;
            transition: opacity 0.2s;
            color: #cbd5e1;
            text-decoration: none;
        }
        footer a:hover { opacity: 0.8; }

        /* MODAL VICTÒRIA */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.65);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.actiu { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            padding: 28px 22px 22px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            text-align: center;
        }
        .modal-emoji { font-size: 3rem; margin-bottom: 8px; }
        .modal-titol { font-size: 1.3rem; font-weight: 900; color: #1e293b; margin-bottom: 6px; }
        .modal-temps { font-size: 1.1rem; font-weight: 700; color: #2563eb; margin-bottom: 16px; }
        .modal-text  { font-size: .85rem; color: #475569; margin-bottom: 18px; }
        .btn-modal { font-family: system-ui, -apple-system, sans-serif; background: #2563eb; color: white; border: none; border-radius: 12px; padding: 13px 28px; font-size: .9rem; font-weight: 700; cursor: pointer; width: 100%; }
        .btn-modal:hover { background: #1d4ed8; }

        /* CONFETI */
        .confeti-c { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
        .confeti-p { position: absolute; top: -20px; animation: cau linear forwards; }
        @keyframes cau { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        /* ESCRIPTORI */
        @media (min-width: 640px) {
            .game-board {
                width: min(60vmin, 440px);
                height: min(60vmin, 440px);
            }
            .numpad { width: min(60vmin, 440px); }
            .toolbar { width: min(60vmin, 440px); }
            .controls { width: min(60vmin, 440px); }
            .cell { font-size: clamp(14px, 3vmin, 26px); }
            main { justify-content: space-evenly; }
        }
    </style>

    <script>
        let board = [], solution = [], selectedCell = null;
        let userBoard = [];           // valors posats per l'usuari (0 = buit)
        let hintCells = [];           // cel·les revelades amb pista (color violeta)
        let notesBoard = [];          // notes[r][c] = Set de números candidats
        let notesMode = false;
        let historial = [];           // [{row, col, prev, prevNotes, isnotes}]
        let currentDifficulty = 'easy';
        let pistes = 3;
        let jocAcabat = true;         // true fins que comença la primera partida

        const DIF_NOM = { easy: 'Fàcil', medium: 'Mitjà', hard: 'Difícil', daily: 'Repte del dia' };
        const DIF_BTN = { easy: 'btn-facil', medium: 'btn-mitja', hard: 'btn-dificil', daily: 'btn-diari' };
        const TOTS_BTN = ['btn-facil', 'btn-mitja', 'btn-dificil', 'btn-diari'];

        // ── REPTE DEL DIA ────────────────────────────────────────────────────
        // Generador determinista: el mateix sudoku per a tothom cada dia
        let rng = Math.random;
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        function dataAvui() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function llavorDelDia() {
            const d = new Date();
            return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
        }
        // Ratxa de dies consecutius amb el repte completat
        function actualitzarRatxaDiaria() {
            const avui = dataAvui();
            let d;
            try { d = JSON.parse(localStorage.getItem('sudoku_diari')) || {}; } catch (e) { d = {}; }
            if (d.ultimaData === avui) return d; // ja completat avui
            const ahir = new Date(Date.now() - 86400000);
            const ahirStr = ahir.getFullYear() + '-' + String(ahir.getMonth() + 1).padStart(2, '0') + '-' + String(ahir.getDate()).padStart(2, '0');
            d.ratxa = (d.ultimaData === ahirStr) ? (d.ratxa || 0) + 1 : 1;
            if (!d.millor || d.ratxa > d.millor) d.millor = d.ratxa;
            d.ultimaData = avui;
            localStorage.setItem('sudoku_diari', JSON.stringify(d));
            return d;
        }

        // ── SO ───────────────────────────────────────────────────────────────
        let soActiu = localStorage.getItem('sudoku_so') !== 'off';
        let audioCtx = null;
        function ctxAudio() {
            if (!soActiu) return null;
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch (e) { return null; }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function nota(freq, t, dur, tipus, vol) {
            const c = ctxAudio(); if (!c) return;
            const o = c.createOscillator(), g = c.createGain();
            o.type = tipus || 'sine';
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.0001, c.currentTime + t);
            g.gain.exponentialRampToValueAtTime(vol || 0.3, c.currentTime + t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + dur);
            o.connect(g); g.connect(c.destination);
            o.start(c.currentTime + t);
            o.stop(c.currentTime + t + dur + 0.05);
        }
        function soToc()     { nota(520, 0, .05, 'triangle', .25); }
        function soEsborra() { nota(300, 0, .05, 'triangle', .2); }
        function soError()   { nota(200, 0, .15, 'sawtooth', .15); nota(160, .12, .2, 'sawtooth', .12); }
        function soBe()      { nota(523, 0, .08, 'sine', .25); nota(659, .09, .1, 'sine', .25); }
        function soGuanya()  { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => nota(f, i * .12, .25, 'triangle', .3)); }
        function toggleSo() {
            soActiu = !soActiu;
            localStorage.setItem('sudoku_so', soActiu ? 'on' : 'off');
            actualitzarSoUI();
        }
        function actualitzarSoUI() {
            document.getElementById('btn-so').textContent = soActiu ? '🔊' : '🔇';
        }

        // ── RÈCORDS ──────────────────────────────────────────────────────────
        let records = (() => {
            try { return JSON.parse(localStorage.getItem('sudoku_records')) || {}; }
            catch (e) { return {}; }
        })();

        // ── PERSISTÈNCIA DE PARTIDA ──────────────────────────────────────────
        function guardarPartida() {
            if (jocAcabat) { localStorage.removeItem('sudoku_partida'); return; }
            localStorage.setItem('sudoku_partida', JSON.stringify({
                board: board,
                solution: solution,
                userBoard: userBoard,
                notes: notesBoard.map(row => row.map(s => Array.from(s))),
                hints: hintCells,
                dif: currentDifficulty,
                pistes: pistes,
                segons: timerSeconds
            }));
        }

        function restaurarPartida() {
            let p;
            try { p = JSON.parse(localStorage.getItem('sudoku_partida')); }
            catch (e) { return false; }
            if (!p || !p.board || !p.solution || !p.userBoard) return false;

            board = p.board;
            solution = p.solution;
            userBoard = p.userBoard;
            hintCells = p.hints || Array(9).fill(null).map(() => Array(9).fill(false));
            notesBoard = (p.notes || Array(9).fill(null).map(() => Array(9).fill(null).map(() => [])))
                .map(row => row.map(a => new Set(a)));
            currentDifficulty = p.dif || 'easy';
            pistes = (typeof p.pistes === 'number') ? p.pistes : 3;
            historial = [];
            notesMode = false;
            jocAcabat = false;
            selectedCell = null;

            TOTS_BTN.forEach(id =>
                document.getElementById(id).classList.remove('active-diff'));
            document.getElementById(DIF_BTN[currentDifficulty] || 'btn-facil').classList.add('active-diff');
            document.getElementById('btn-pista').textContent = `💡 Pista (${pistes})`;
            document.getElementById('btn-pista').disabled = pistes === 0;

            updateNotesUI();
            renderBoard();
            const msg = document.getElementById('message');
            msg.textContent = 'Partida recuperada — continues on eres.';
            msg.style.color = '#2563eb';
            startTimer(p.segons || 0);
            return true;
        }

        // ── TIMER ────────────────────────────────────────────────────────────
        let timerInterval = null;
        let timerSeconds = 0;
        let timerRunning = false;

        function ticInterval() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
                if (timerSeconds % 10 === 0) guardarPartida();
            }, 1000);
        }

        function startTimer(des) {
            stopTimer();
            timerSeconds = des || 0;
            updateTimerDisplay();
            timerRunning = true;
            ticInterval();
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            timerRunning = false;
        }

        // Pausa el cronòmetre quan la pestanya no és visible (rècords justos)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                guardarPartida();
            } else if (timerRunning && !jocAcabat && !timerInterval) {
                ticInterval();
            }
        });

        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            document.getElementById('timer-display').textContent =
                m + ':' + String(s).padStart(2, '0');
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m} min ${s} seg` : `${s} seg`;
        }

        // ── JOCS ─────────────────────────────────────────────────────────────
        window.onload = () => {
            actualitzarSoUI();
            if (!restaurarPartida()) newGame('easy');
        };

        function newGame(difficulty) {
            if (!jocAcabat && historial.length > 0 &&
                !confirm('Vols començar una partida nova? Es perdrà la partida actual.')) return;

            currentDifficulty = difficulty;
            pistes = 3;
            jocAcabat = false;
            document.getElementById('btn-pista').textContent = '💡 Pista (3)';
            document.getElementById('btn-pista').disabled = false;

            // Destacar dificultat activa
            TOTS_BTN.forEach(id =>
                document.getElementById(id).classList.remove('active-diff'));
            document.getElementById(DIF_BTN[difficulty]).classList.add('active-diff');

            // Repte del dia: generació determinista a partir de la data
            rng = difficulty === 'daily' ? mulberry32(llavorDelDia()) : Math.random;

            generateSudoku();
            removeNumbers(difficulty);
            userBoard = Array(9).fill(null).map(() => Array(9).fill(0));
            hintCells = Array(9).fill(null).map(() => Array(9).fill(false));
            notesBoard = Array(9).fill(null).map(() => Array(9).fill(null).map(() => new Set()));
            historial = [];
            notesMode = false;
            updateNotesUI();
            renderBoard();
            const msg = document.getElementById('message');
            const rec = records[difficulty];
            msg.textContent = difficulty === 'daily'
                ? '📅 El sudoku d\'avui — el mateix per a tothom!'
                : (rec ? `El teu millor temps (${DIF_NOM[difficulty]}): ${formatTime(rec)}` : '');
            msg.style.color = '#475569';
            selectedCell = null;
            startTimer(0);
            guardarPartida();
        }

        function generateSudoku() {
            solution = Array(9).fill().map(() => Array(9).fill(0));
            fillDiagonal();
            solveSudoku(solution);
            board = JSON.parse(JSON.stringify(solution));
        }

        function fillDiagonal() {
            for (let i = 0; i < 9; i += 3) fillBox(i, i);
        }

        function fillBox(row, col) {
            let num;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    do { num = Math.floor(rng() * 9) + 1; }
                    while (!isSafeInBox(row, col, num));
                    solution[row + i][col + j] = num;
                }
            }
        }

        function isSafeInBox(rs, cs, num) {
            for (let i = 0; i < 3; i++)
                for (let j = 0; j < 3; j++)
                    if (solution[rs+i][cs+j] === num) return false;
            return true;
        }

        function isSafe(grid, row, col, num) {
            for (let x = 0; x < 9; x++)
                if (grid[row][x] === num || grid[x][col] === num) return false;
            let sr = row - row%3, sc = col - col%3;
            for (let i = 0; i < 3; i++)
                for (let j = 0; j < 3; j++)
                    if (grid[sr+i][sc+j] === num) return false;
            return true;
        }

        function solveSudoku(grid) {
            for (let i = 0; i < 9; i++)
                for (let j = 0; j < 9; j++)
                    if (grid[i][j] === 0) {
                        for (let n = 1; n <= 9; n++) {
                            if (isSafe(grid, i, j, n)) {
                                grid[i][j] = n;
                                if (solveSudoku(grid)) return true;
                                grid[i][j] = 0;
                            }
                        }
                        return false;
                    }
            return true;
        }

        function removeNumbers(difficulty) {
            let count = difficulty === 'easy' ? 30 : difficulty === 'medium' ? 45 : difficulty === 'daily' ? 45 : 55;
            while (count > 0) {
                let r = Math.floor(rng()*9), c = Math.floor(rng()*9);
                if (board[r][c] !== 0) { board[r][c] = 0; count--; }
            }
        }

        // ── RENDER ────────────────────────────────────────────────────────────
        function renderBoard() {
            const container = document.getElementById('board');
            container.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const div = document.createElement('div');
                    div.classList.add('cell');
                    if (j === 2 || j === 5) div.classList.add('right-thick');
                    if (i === 2 || i === 5) div.classList.add('bottom-thick');

                    if (board[i][j] !== 0) {
                        div.textContent = board[i][j];
                        div.classList.add('fixed');
                    } else {
                        div.classList.add('user-input');
                        div.dataset.row = i;
                        div.dataset.col = j;
                        div.onclick = () => selectCell(div);
                        const uv = userBoard[i] ? (userBoard[i][j] || 0) : 0;
                        if (uv > 0) {
                            div.textContent = uv;
                            if (hintCells[i] && hintCells[i][j]) div.style.color = '#9333ea';
                        } else {
                            renderCellContent(div, i, j);
                        }
                    }
                    container.appendChild(div);
                }
            }
        }

        function renderCellContent(div, r, c) {
            const notes = notesBoard[r][c];
            const num = parseInt(div.textContent) || 0;

            // If has real number
            if (num > 0) {
                div.classList.remove('has-notes');
                div.innerHTML = num;
                return;
            }
            // If has notes
            if (notes && notes.size > 0) {
                div.classList.add('has-notes');
                const grid = document.createElement('div');
                grid.className = 'notes-grid';
                const sorted = Array.from(notes).sort((a, b) => a - b).slice(0, 4);
                for (let i = 0; i < 4; i++) {
                    const span = document.createElement('span');
                    span.className = 'note-num';
                    span.textContent = sorted[i] !== undefined ? sorted[i] : '';
                    grid.appendChild(span);
                }
                div.innerHTML = '';
                div.appendChild(grid);
            } else {
                div.classList.remove('has-notes');
                div.innerHTML = '';
            }
        }

        function refreshAllCells() {
            document.querySelectorAll('.cell.user-input').forEach(div => {
                const r = parseInt(div.dataset.row), c = parseInt(div.dataset.col);
                renderCellContent(div, r, c);
            });
        }

        // ── SELECCIÓ ────────────────────────────────────────────────────────
        function selectCell(div) {
            // Eliminar selecció i subratllats anteriors
            document.querySelectorAll('.cell.selected, .cell.same-num').forEach(el => {
                el.classList.remove('selected', 'same-num');
            });

            selectedCell = div;
            div.classList.add('selected');

            // Subratllar celes amb el mateix número
            const selNum = parseInt(div.textContent) || 0;
            if (selNum > 0) {
                document.querySelectorAll('.cell').forEach(el => {
                    if (el !== div) {
                        const txt = parseInt(el.textContent) || 0;
                        if (txt === selNum && !el.classList.contains('has-notes')) {
                            el.classList.add('same-num');
                        }
                    }
                });
            }
        }

        // ── INPUT ─────────────────────────────────────────────────────────────
        function inputNumber(num) {
            if (!selectedCell || jocAcabat) return;
            const r = parseInt(selectedCell.dataset.row);
            const c = parseInt(selectedCell.dataset.col);
            const prevVal = parseInt(selectedCell.textContent) || 0;
            const prevNotes = new Set(notesBoard[r][c]);

            if (notesMode && num !== 'delete') {
                // Mode notes: toggle el número (màxim 4)
                historial.push({ row: r, col: c, prev: prevVal, prevNotes: new Set(prevNotes), isNotes: true });
                if (notesBoard[r][c].has(num)) notesBoard[r][c].delete(num);
                else if (notesBoard[r][c].size < 4) notesBoard[r][c].add(num);
                soToc();
                renderCellContent(selectedCell, r, c);
            } else if (num === 'delete') {
                historial.push({ row: r, col: c, prev: prevVal, prevNotes: new Set(prevNotes), isNotes: false });
                selectedCell.textContent = '';
                selectedCell.classList.remove('error');
                selectedCell.style.color = '';
                notesBoard[r][c].clear();
                userBoard[r][c] = 0;
                hintCells[r][c] = false;
                soEsborra();
                renderCellContent(selectedCell, r, c);
            } else {
                // Mode normal: posar número
                historial.push({ row: r, col: c, prev: prevVal, prevNotes: new Set(prevNotes), isNotes: false });
                notesBoard[r][c].clear();
                selectedCell.textContent = num;
                selectedCell.classList.remove('error', 'has-notes');
                selectedCell.style.color = '';
                userBoard[r][c] = num;
                hintCells[r][c] = false;
                soToc();
                // Actualitzar subratllat
                selectCell(selectedCell);
                comprovarAutoVictoria();
            }
            guardarPartida();
        }

        // ── DESFER ────────────────────────────────────────────────────────────
        function desfer() {
            if (!historial.length || jocAcabat) return;
            const last = historial.pop();
            const { row, col, prev, prevNotes } = last;
            const div = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            if (!div) return;
            notesBoard[row][col] = new Set(prevNotes);
            userBoard[row][col] = prev > 0 ? prev : 0;
            hintCells[row][col] = false;
            div.style.color = '';
            if (prev > 0) {
                div.textContent = prev;
                div.classList.remove('error', 'has-notes');
            } else {
                div.textContent = '';
                div.classList.remove('error');
            }
            renderCellContent(div, row, col);
            guardarPartida();
        }

        // ── NOTES ─────────────────────────────────────────────────────────────
        function toggleNotes() {
            notesMode = !notesMode;
            updateNotesUI();
        }

        function updateNotesUI() {
            const btn = document.getElementById('btn-notes');
            btn.classList.toggle('notes-on', notesMode);
            btn.textContent = notesMode ? '✏️ Notes ON' : '✏️ Notes';
            document.querySelectorAll('.num-btn:not(.del)').forEach(b =>
                b.classList.toggle('notes-mode', notesMode));
        }

        // ── PISTA ─────────────────────────────────────────────────────────────
        function donarPista() {
            if (pistes <= 0 || jocAcabat) return;
            // Buscar celes buides i mostrar-ne una aleatòria
            const buides = [];
            document.querySelectorAll('.cell.user-input').forEach(div => {
                const r = parseInt(div.dataset.row), c = parseInt(div.dataset.col);
                const v = parseInt(div.textContent) || 0;
                if (v === 0 || div.classList.contains('error')) buides.push({ div, r, c });
            });
            if (!buides.length) return;
            const target = buides[Math.floor(Math.random() * buides.length)];
            const { div, r, c } = target;
            notesBoard[r][c].clear();
            div.textContent = solution[r][c];
            div.classList.remove('error', 'has-notes');
            div.style.color = '#9333ea'; // violeta per pistes
            userBoard[r][c] = solution[r][c];
            hintCells[r][c] = true;
            soToc();
            pistes--;
            document.getElementById('btn-pista').textContent = `💡 Pista (${pistes})`;
            if (pistes === 0) document.getElementById('btn-pista').disabled = true;
            selectCell(div);
            comprovarAutoVictoria();
            guardarPartida();
        }

        // ── TECLAT FÍSIC ───────────────────────────────────────────────────────
        document.addEventListener('keydown', e => {
            if (!selectedCell) return;
            if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key));
            else if (e.key === 'Backspace' || e.key === 'Delete') inputNumber('delete');
            else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); desfer(); }
            else if (e.key === 'n') toggleNotes();
            // Navegació amb tecles de fletxa
            else if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const r = parseInt(selectedCell.dataset.row);
                const c = parseInt(selectedCell.dataset.col);
                let nr = r, nc = c;
                if (e.key === 'ArrowUp')    nr = Math.max(0, r - 1);
                if (e.key === 'ArrowDown')  nr = Math.min(8, r + 1);
                if (e.key === 'ArrowLeft')  nc = Math.max(0, c - 1);
                if (e.key === 'ArrowRight') nc = Math.min(8, c + 1);
                const next = document.querySelector(`.cell[data-row="${nr}"][data-col="${nc}"]`);
                if (next) selectCell(next);
            }
        });

        // ── COMPROVAR ─────────────────────────────────────────────────────────
        function checkSolution() {
            if (jocAcabat) return;
            const cells = document.querySelectorAll('.cell.user-input');
            let errors = 0, filled = 0;
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
                const val = parseInt(cell.textContent);
                if (cell.textContent && !cell.classList.contains('has-notes') && val > 0) {
                    filled++;
                    if (val !== solution[r][c]) { cell.classList.add('error'); errors++; }
                    else cell.classList.remove('error');
                }
            });
            const msg = document.getElementById('message');
            if (errors > 0) {
                msg.textContent = `Tens ${errors} error${errors>1?'s':''}. Continua!`;
                msg.style.color = '#dc2626';
                soError();
            } else if (filled === cells.length) {
                victoria();
            } else {
                msg.textContent = 'De moment tot correcte, però no has acabat.';
                msg.style.color = '#2563eb';
                soBe();
            }
        }

        // Victòria automàtica en col·locar l'últim número correcte
        function comprovarAutoVictoria() {
            for (let i = 0; i < 9; i++)
                for (let j = 0; j < 9; j++)
                    if (board[i][j] === 0 && userBoard[i][j] !== solution[i][j]) return;
            victoria();
        }

        function victoria() {
            jocAcabat = true;
            stopTimer();
            localStorage.removeItem('sudoku_partida');
            const msg = document.getElementById('message');
            msg.textContent = '🎉 Felicitats! Sudoku completat!';
            msg.style.color = '#16a34a';
            soGuanya();
            if (navigator.vibrate) try { navigator.vibrate([100, 60, 100, 60, 180]); } catch (e) {}
            mostrarVictoria();
        }

        function mostrarVictoria() {
            const anterior = records[currentDifficulty];
            const nouRecord = !anterior || timerSeconds < anterior;
            if (nouRecord) {
                records[currentDifficulty] = timerSeconds;
                localStorage.setItem('sudoku_records', JSON.stringify(records));
            }
            let extra = '';
            if (currentDifficulty === 'daily') {
                const d = actualitzarRatxaDiaria();
                extra = `<br>📅 Ratxa diària: <b>${d.ratxa} ${d.ratxa === 1 ? 'dia' : 'dies'}</b>` +
                    (d.ratxa === d.millor && d.ratxa > 1 ? ' — la teva millor!' : (d.millor > d.ratxa ? ` · Millor: ${d.millor}` : ''));
            }
            document.getElementById('modal-temps-text').textContent =
                `Temps: ${formatTime(timerSeconds)}`;
            document.getElementById('modal-body').innerHTML =
                `Dificultat: ${DIF_NOM[currentDifficulty]} · Pistes usades: ${3 - pistes}/3<br>` +
                (nouRecord
                    ? '🏆 <b style="color:#16a34a">Nou rècord personal!</b>'
                    : `El teu millor temps: ${formatTime(anterior)}`) + extra;
            document.getElementById('modal-victora').classList.add('actiu');
            llençarConfeti();
        }

        function llençarConfeti() {
            const cont = document.getElementById('confeti');
            cont.innerHTML = '';
            const cs = ['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed'];
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'confeti-p';
                p.style.left = Math.random()*100 + 'vw';
                p.style.width = p.style.height = (6 + Math.random()*8) + 'px';
                p.style.backgroundColor = cs[Math.floor(Math.random()*cs.length)];
                p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                p.style.animationDuration = (1.5 + Math.random()*2) + 's';
                p.style.animationDelay = Math.random()*0.6 + 's';
                cont.appendChild(p);
                p.addEventListener('animationend', () => p.remove());
            }
        }

    </script>
