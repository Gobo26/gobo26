<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dominó – Gobo26</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --fons: #f1f5f9;
            --text: #334155;
            --primari: #2563eb;
            --primari-fosc: #1d4ed8;
            --header-bg: #1e293b;
            --blanc: #ffffff;
            --verd: #16a34a;
            --vermell: #dc2626;
            --taronja: #ea580c;
            --gris: #94a3b8;
            --ombra: rgba(0,0,0,0.10);
            --domino-bg: #ffffff;
            --domino-bord: #334155;
        }

        html, body {
            font-family: 'Montserrat', sans-serif;
            background: var(--fons);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--header-bg);
            color: white;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }
        .logo-txt { font-size: .9rem; font-weight: 900; color: white; letter-spacing: -.5px; }
        .logo-txt span { color: #3b82f6; }

        .hdr-title{
            flex: 1;
            text-align: center;
            font-size: clamp(.9rem, 3.5vw, 1.1rem);
            font-weight: 800;
            color: white;
            letter-spacing: -.3px;
        }

        #btn-ajuda{
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,.15);
            border: 2px solid rgba(255,255,255,.3);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
            flex-shrink: 0;
        }
        #btn-ajuda:hover { background: rgba(255,255,255,.28); }

        /* ===== CONTINGUT PRINCIPAL ===== */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ===== MISSATGE ===== */
        #missatges {
            background: var(--blanc);
            border-radius: 12px;
            border-left: 6px solid var(--primari);
            padding: 14px 18px;
            font-size: clamp(.9rem, 3vw, 1.1rem);
            font-weight: 700;
            color: var(--text);
            box-shadow: 0 2px 8px var(--ombra);
            text-align: center;
        }
        #missatges.guanya { border-left-color: var(--verd); color: var(--verd); }
        #missatges.perd   { border-left-color: var(--vermell); color: var(--vermell); }

        /* ===== INFO MÀQUINA ===== */
        .info-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: var(--blanc);
            border-radius: 12px;
            padding: 10px 18px;
            box-shadow: 0 2px 8px var(--ombra);
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .8rem;
            font-weight: 700;
            color: var(--text);
        }
        .info-item .num {
            background: var(--primari);
            color: white;
            border-radius: 99px;
            padding: 2px 10px;
            font-size: .85rem;
            font-weight: 900;
        }
        .info-item .num.taronja { background: var(--taronja); }

        /* ===== TAULER ===== */
        #tauler-contenidor {
            background: #e2e8f0;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            min-height: 110px;
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding: 14px 16px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,.08);
            scrollbar-width: thin;
            scrollbar-color: #94a3b8 transparent;
        }
        #tauler {
            display: flex;
            gap: 6px;
            align-items: center;
            min-width: min-content;
        }
        .tauler-buit {
            color: #94a3b8;
            font-size: .85rem;
            font-weight: 600;
            width: 100%;
            text-align: center;
        }

        /* ===== MÀ DEL JUGADOR ===== */
        .zona-jugador {
            background: var(--blanc);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px var(--ombra);
        }
        .zona-etiqueta {
            font-size: .7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--gris);
            margin-bottom: 14px;
            text-align: center;
        }
        #meves-fitxes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        /* ===== FITXA ===== */
        .fitxa {
            background-color: var(--domino-bg);
            border: 2.5px solid var(--domino-bord);
            border-radius: 8px;
            width: 54px;
            height: 92px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 3px 3px 0 rgba(0,0,0,.18);
            transition: transform .15s, box-shadow .15s;
            user-select: none;
            flex-shrink: 0;
        }
        .fitxa:hover {
            transform: translateY(-8px);
            box-shadow: 3px 10px 0 rgba(0,0,0,.15);
        }
        .fitxa.horitzontal {
            width: 92px;
            height: 54px;
            flex-direction: row;
        }
        .meitat {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
        }
        .separador {
            background-color: var(--domino-bord);
            height: 2.5px;
            width: 100%;
            flex-shrink: 0;
        }
        .separador-v {
            background-color: var(--domino-bord);
            width: 2.5px;
            height: 100%;
            flex-shrink: 0;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .boto {
            padding: 14px 28px;
            font-size: .95rem;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: white;
            background: var(--primari);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primari-fosc);
            transition: transform .1s, box-shadow .1s;
            letter-spacing: -.2px;
        }
        .boto:active {
            box-shadow: 0 1px 0 var(--primari-fosc);
            transform: translateY(3px);
        }
        .boto-passar {
            background: var(--taronja);
            box-shadow: 0 4px 0 #c2410c;
        }
        .boto-passar:active { box-shadow: 0 1px 0 #c2410c; }
        .boto-reiniciar {
            background: #64748b;
            box-shadow: 0 4px 0 #475569;
        }
        .boto-reiniciar:active { box-shadow: 0 1px 0 #475569; }

        /* ===== ANIMATIONS ===== */
        @keyframes popIn { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:scale(1); } }
        .fitxa { animation: popIn .15s ease both; }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <a href="https://gobo26.github.io/gobo26/" target="_self" class="logo">
        <svg width="32" height="32" viewBox="0 0 40 46" fill="none">
            <path d="M20 1L38 11V33L20 43L2 33V11L20 1Z" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
            <text x="20" y="23" text-anchor="middle" fill="white" font-family="Montserrat,sans-serif" font-weight="900" font-size="9">GOBO</text>
            <text x="20" y="33" text-anchor="middle" fill="#93c5fd" font-family="Montserrat,sans-serif" font-weight="900" font-size="7">26</text>
        </svg>
        <span class="logo-txt">Gobo<span>26</span></span>
    </a>
    <span class="hdr-title">🃣 Dominó</span>
    <button id="btn-ajuda" onclick="mostrarAjuda()" title="Com jugar">?</button>
</header>

<main>
    <div id="missatges">Benvingut! Tria una fitxa per començar.</div>

    <div class="info-bar">
        <div class="info-item">
            Màquina: <span id="num-maquina" class="num taronja">7</span>
        </div>
        <div class="info-item">
            Tu: <span id="num-jugador" class="num">7</span>
        </div>
    </div>

    <div id="tauler-contenidor">
        <div id="tauler">
            <div class="tauler-buit">Tauler buit — juga la primera fitxa</div>
        </div>
    </div>

    <div class="zona-jugador">
        <div class="zona-etiqueta">Les teves fitxes</div>
        <div id="meves-fitxes"></div>
    </div>

    <div class="controls">
        <button class="boto boto-reiniciar" onclick="reiniciarJoc()">🔄 Nova Partida</button>
        <button id="btn-passar" class="boto boto-passar" onclick="passarITornMaquina()" style="display:none;">⏭ Passo torn</button>
    </div>
</main>

<script>
    var totesFitxes = [];
    var maquina = [];
    var jugador = [];
    var extrems = [null, null];
    var jocActiu = false;

    function crearFitxes() {
        totesFitxes = [];
        for (var i = 0; i <= 6; i++) {
            for (var j = i; j <= 6; j++) {
                totesFitxes.push([i, j]);
            }
        }
    }

    function barrejar(array) {
        for (var i = array.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = array[i]; array[i] = array[j]; array[j] = tmp;
        }
    }

    function crearVisualFitxa(valors, onclickFn) {
        var f = document.createElement('div');
        f.className = 'fitxa';
        f.innerHTML =
            '<div class="meitat">' + valors[0] + '</div>' +
            '<div class="separador"></div>' +
            '<div class="meitat">' + valors[1] + '</div>';
        if (onclickFn) f.onclick = function() { onclickFn(valors); };
        return f;
    }

    function crearVisualTauler(valors) {
        var f = document.createElement('div');
        f.className = 'fitxa horitzontal';
        f.innerHTML =
            '<div class="meitat">' + valors[0] + '</div>' +
            '<div class="separador-v"></div>' +
            '<div class="meitat">' + valors[1] + '</div>';
        return f;
    }

    function actualitzarInterficie() {
        var cont = document.getElementById('meves-fitxes');
        cont.innerHTML = '';
        jugador.forEach(function(v) {
            cont.appendChild(crearVisualFitxa(v, jugarJugador));
        });
        document.getElementById('num-maquina').innerText = maquina.length;
        document.getElementById('num-jugador').innerText = jugador.length;

        var btnP = document.getElementById('btn-passar');
        btnP.style.display = (jocActiu && !potJugar(jugador)) ? 'block' : 'none';
    }

    function potJugar(ma) {
        if (extrems[0] === null) return true;
        return ma.some(function(f) { return f[0] === extrems[0] || f[1] === extrems[0] || f[0] === extrems[1] || f[1] === extrems[1]; });
    }

    function afegirAlTauler(valors, posicio) {
        var t = document.getElementById('tauler');
        // Eliminar missatge buit si existeix
        var buit = t.querySelector('.tauler-buit');
        if (buit) buit.remove();
        var visual = crearVisualTauler(valors);
        if (posicio === 'inici') t.insertBefore(visual, t.firstChild);
        else t.appendChild(visual);
        // Fer scroll al final
        var contenidor = document.getElementById('tauler-contenidor');
        contenidor.scrollLeft = (posicio === 'inici') ? 0 : contenidor.scrollWidth;
    }

    function jugarJugador(valors) {
        if (!jocActiu) return;
        var f = [valors[0], valors[1]];
        var exit = false;

        if (extrems[0] === null) {
            // Primera fitxa del joc
            extrems = [f[0], f[1]];
            afegirAlTauler(f, 'final');
            exit = true;
        } else if (f[0] === extrems[1]) {
            extrems[1] = f[1];
            afegirAlTauler(f, 'final');
            exit = true;
        } else if (f[1] === extrems[1]) {
            extrems[1] = f[0];
            afegirAlTauler([f[1], f[0]], 'final');
            exit = true;
        } else if (f[1] === extrems[0]) {
            extrems[0] = f[0];
            afegirAlTauler(f, 'inici');
            exit = true;
        } else if (f[0] === extrems[0]) {
            extrems[0] = f[1];
            afegirAlTauler([f[1], f[0]], 'inici');
            exit = true;
        }

        if (exit) {
            jugador = jugador.filter(function(x) { return !(x[0] === valors[0] && x[1] === valors[1]); });
            setMissatge("Molt bé! Ara li toca a la màquina...", '');
            checkFinal();
            if (jocActiu) {
                actualitzarInterficie();
                setTimeout(tornMaquina, 900);
            } else {
                actualitzarInterficie();
            }
        } else {
            alert("Aquesta fitxa no encaixa ara. Prova-la a l'altre extrem o tria'n una altra.");
        }
    }

    function tornMaquina() {
        if (!jocActiu) return;
        var index = -1;
        for (var i = 0; i < maquina.length; i++) {
            var f = maquina[i];
            if (f[0] === extrems[0] || f[1] === extrems[0] || f[0] === extrems[1] || f[1] === extrems[1]) {
                index = i;
                break;
            }
        }

        if (index !== -1) {
            var f = [maquina[index][0], maquina[index][1]];
            if (f[0] === extrems[1]) {
                extrems[1] = f[1];
                afegirAlTauler(f, 'final');
            } else if (f[1] === extrems[1]) {
                extrems[1] = f[0];
                afegirAlTauler([f[1], f[0]], 'final');
            } else if (f[1] === extrems[0]) {
                extrems[0] = f[0];
                afegirAlTauler(f, 'inici');
            } else {
                extrems[0] = f[1];
                afegirAlTauler([f[1], f[0]], 'inici');
            }
            maquina.splice(index, 1);
            setMissatge("La màquina ha mogut. El teu torn!", '');
        } else {
            setMissatge("La màquina no pot moure i passa torn. Et toca!", '');
        }
        checkFinal();
        actualitzarInterficie();
    }

    function passarITornMaquina() {
        setMissatge("Has passat torn. Juga la màquina...", '');
        actualitzarInterficie();
        setTimeout(tornMaquina, 700);
    }

    function checkFinal() {
        if (jugador.length === 0) {
            setMissatge("🎉 FELICITATS! Has guanyat la partida!", 'guanya');
            jocActiu = false;
        } else if (maquina.length === 0) {
            setMissatge("Ha guanyat la màquina. Torna-ho a provar!", 'perd');
            jocActiu = false;
        } else if (!potJugar(jugador) && !potJugar(maquina)) {
            var ptsJ = jugador.reduce(function(s, f) { return s + f[0] + f[1]; }, 0);
            var ptsM = maquina.reduce(function(s, f) { return s + f[0] + f[1]; }, 0);
            if (ptsJ < ptsM) setMissatge("Joc bloquejat! Guanyes tu (menys punts). 🎉", 'guanya');
            else if (ptsM < ptsJ) setMissatge("Joc bloquejat! Guanya la màquina (menys punts).", 'perd');
            else setMissatge("Joc bloquejat! Empat!", '');
            jocActiu = false;
        }
    }

    function setMissatge(text, cls) {
        var el = document.getElementById('missatges');
        el.innerText = text;
        el.className = cls;
    }

    function reiniciarJoc() {
        crearFitxes();
        barrejar(totesFitxes);
        jugador = totesFitxes.slice(0, 7).map(function(f) { return [f[0], f[1]]; });
        maquina = totesFitxes.slice(7, 14).map(function(f) { return [f[0], f[1]]; });
        extrems = [null, null];
        var t = document.getElementById('tauler');
        t.innerHTML = '<div class="tauler-buit">Tauler buit — juga la primera fitxa</div>';
        setMissatge("El teu torn. Tria una fitxa per començar.", '');
        jocActiu = true;
        actualitzarInterficie();
    }

    function mostrarAjuda() {
        alert(
            "🁣 COM JUGAR AL DOMINÓ\n\n" +
            "• Clica una fitxa per jugar-la al tauler.\n" +
            "• La fitxa ha de coincidir amb un dels extrems del tauler.\n" +
            "• Si no pots jugar cap fitxa, prem 'Passo torn'.\n" +
            "• Guanya qui primer es quedi sense fitxes.\n" +
            "• Si el joc queda bloquejat, guanya qui tingui menys punts."
        );
    }

    // Iniciar al carregar
    reiniciarJoc();
</script>
<footer style="font-size:.72rem;color:#94a3b8;font-weight:600;text-align:center;padding:16px;flex-shrink:0;border-top:1px solid #1e2d45;">
    <a href="https://gobo26.github.io/gobo26/" target="_self"
       style="display:inline-flex;align-items:center;gap:6px;opacity:0.4;transition:opacity 0.2s;color:#94a3b8;text-decoration:none;"
       onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=0.4">
        <svg width="13" height="13" viewBox="0 0 100 100" fill="none"><polygon points="50,2 93,26 93,74 50,98 7,74 7,26" fill="#94a3b8"/><text x="50" y="44" text-anchor="middle" fill="white" font-size="26" font-weight="800" font-family="sans-serif">G</text><text x="50" y="68" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700" font-family="sans-serif">26</text></svg>
        Una aplicació de Gobo26
    </a>
</footer>
</body>
</html>
