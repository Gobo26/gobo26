<html lang="ca">
<head>

<title>Gobo26 - Murdoku</title>

<meta name="theme-color" content="#1e293b">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
:root{
  --bg:#f1f5f9; --panel:#ffffff; --ink:#1e293b; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --line2:#cbd5e1;
  --blau:#2563eb; --blau-fosc:#1d4ed8;
  --verd:#16a34a; --vermell:#b91c1c; --vermell-clar:#fee2e2; --ambre:#d97706;
  --victima:#7f1d1d;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink2);
  display:flex; flex-direction:column; min-height:100%;
  -webkit-tap-highlight-color:transparent;
}

/* HEADER */
header{background:var(--ink); border-bottom:1px solid #334155; padding:10px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  position:sticky; top:0; z-index:40; flex-shrink:0;}
.logo{display:flex; align-items:center; gap:8px; text-decoration:none;}
.logo-txt{font-size:.95rem; font-weight:900; color:#fff; letter-spacing:-.5px;}
.logo-txt span{color:#f87171;}
.hdr-title{font-size:.95rem; font-weight:800; color:#fff; letter-spacing:.5px; display:flex; align-items:center; gap:6px;}
.hdr-right{display:flex; align-items:center; gap:10px;}
#timer{font-size:1rem; font-weight:800; color:#fca5a5; letter-spacing:1px; font-variant-numeric:tabular-nums; min-width:52px; text-align:right;}
.icon-btn{background:transparent; border:0; color:#cbd5e1; font-size:1.15rem; cursor:pointer; padding:2px 4px; line-height:1;}
.icon-btn:hover{color:#fff;}

/* LAYOUT */
main{flex:1; width:100%; max-width:1080px; margin:0 auto; padding:10px 12px 30px;}
.controls{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.controls button{flex:1 1 auto; min-width:74px; padding:8px 6px; border:2px solid var(--line2);
  border-radius:8px; background:#fff; color:var(--ink2); cursor:pointer;
  font:inherit; font-size:.78rem; font-weight:700; transition:all .15s;}
.controls button:hover{background:#eef2f7;}
.controls button.actiu{background:var(--ink); border-color:var(--ink); color:#fff;}
.controls .nou{background:var(--vermell); border-color:var(--vermell); color:#fff;}
.controls .nou:hover{background:#991b1b;}
.controls .diari{background:var(--ambre); border-color:var(--ambre); color:#fff;}
.controls .diari:hover{background:#b45309;}

.wrap{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
.col-joc{flex:1 1 340px; min-width:300px; display:flex; flex-direction:column; gap:12px;}
.col-info{flex:1 1 300px; min-width:270px; display:flex; flex-direction:column; gap:12px;}

/* DOSSIER / HISTÒRIA */
.dossier{background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--vermell);
  border-radius:10px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.dossier .cas-titol{font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:var(--vermell); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.dossier h2{font-size:1.05rem; color:var(--ink); margin-bottom:8px; line-height:1.25;}
.dossier p{font-size:.9rem; line-height:1.55;}
.dossier .arma{margin-top:8px; font-size:.82rem; color:var(--ink2);}
.dossier .arma b{color:var(--ink);}

/* TAULER */
.taula-embolcall{background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.board{display:grid; gap:5px; width:100%; max-width:540px; margin:0 auto;}
.cel{position:relative; aspect-ratio:1/1; border:1px solid var(--line2); border-radius:8px;
  background:linear-gradient(160deg,#fbfcfe,#eef2f7); cursor:pointer; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2px; transition:transform .08s, box-shadow .12s, border-color .12s;}
.cel:hover{border-color:var(--blau);}
.cel:active{transform:scale(.96);}
.cel .room-ic{font-size:1.15rem; line-height:1;}
.cel .room-nom{font-size:.5rem; font-weight:700; color:var(--ink3); text-align:center;
  line-height:1.05; margin-top:2px; text-transform:uppercase; letter-spacing:.02em;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.cel.victima{background:linear-gradient(160deg,#fee2e2,#fecaca); border-color:var(--victima);}
.cel.victima .room-nom{color:var(--victima);}
.cel .cos{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; opacity:.9; pointer-events:none;}
.cel.conflicte{border-color:var(--vermell); box-shadow:inset 0 0 0 2px var(--vermell);}
.cel.correcte-flash{border-color:var(--verd); box-shadow:inset 0 0 0 2px var(--verd);}
.cel .avatar{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:62%; height:62%; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:900; font-size:1rem; box-shadow:0 2px 5px rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.85);}
.cel .destaca{position:absolute; inset:0; box-shadow:inset 0 0 0 3px var(--blau); border-radius:8px; pointer-events:none;}
.board.n4 .cel .avatar{font-size:1.2rem;}
.board.n4 .cel .room-nom{font-size:.62rem;}
.board.n4 .cel .room-ic{font-size:1.5rem;}
.board.n5 .cel .room-nom{font-size:.54rem;}
.board.n5 .cel .room-ic{font-size:1.3rem;}
.board.n6 .cel .room-nom{font-size:.46rem;}
.board.n6 .cel .room-ic{font-size:1.05rem;}
.board.n6 .cel .avatar{font-size:.82rem; border-width:1px;}

/* SAFATA SOSPITOSOS */
.tray-tit, .clues-tit{font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink2); margin:2px 0 6px; display:flex; align-items:center; justify-content:space-between;}
.tray{display:flex; flex-wrap:wrap; gap:7px;}
.chip{display:flex; align-items:center; gap:7px; padding:6px 10px 6px 6px; border:2px solid var(--line2);
  border-radius:40px; background:#fff; cursor:pointer; font:inherit; transition:all .12s;}
.chip:hover{border-color:var(--ink2);}
.chip.sel{border-color:var(--blau); box-shadow:0 0 0 3px rgba(37,99,235,.18); background:#eff6ff;}
.chip.colocat{opacity:.42;}
.chip .av{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:900; font-size:.9rem; flex-shrink:0; border:2px solid rgba(255,255,255,.8);}
.chip .nom{font-size:.86rem; font-weight:700; color:var(--ink);}
.chip .em{font-size:.9rem;}

/* TOOLBAR */
.toolbar{display:flex; gap:6px; flex-wrap:wrap;}
.toolbar button{flex:1 1 auto; min-width:88px; padding:9px 6px; border:2px solid var(--line2);
  border-radius:8px; background:#fff; color:var(--ink2); cursor:pointer; font:inherit;
  font-size:.8rem; font-weight:700; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:5px;}
.toolbar button:hover{background:#eef2f7;}
.toolbar .comprova{background:var(--blau); border-color:var(--blau); color:#fff;}
.toolbar .comprova:hover{background:var(--blau-fosc);}

/* PISTES */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);}
.clues{list-style:none; display:flex; flex-direction:column; gap:8px;}
.clues li{display:flex; gap:9px; font-size:.9rem; line-height:1.4; color:var(--ink);
  padding:9px 11px; background:#f8fafc; border:1px solid var(--line); border-radius:8px;}
.clues li .num{flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--ink);
  color:#fff; font-size:.7rem; font-weight:800; display:flex; align-items:center; justify-content:center;}
.clues li.feta{opacity:.5; text-decoration:line-through; text-decoration-color:var(--ink3);}

/* RÈCORDS */
.records{display:flex; gap:8px; flex-wrap:wrap;}
.rec-card{flex:1 1 80px; background:#f8fafc; border:1px solid var(--line); border-radius:9px; padding:9px; text-align:center;}
.rec-card .n{font-size:1.05rem; font-weight:900; color:var(--ink);}
.rec-card .l{font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3); margin-top:2px;}

/* MISSATGE FLOTANT */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:30px; font-size:.86rem; font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:all .25s; z-index:60; max-width:90vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.bo{background:var(--verd);} #toast.err{background:var(--vermell);}

/* MODAL */
.modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.72); display:none; align-items:center;
  justify-content:center; z-index:70; padding:18px; backdrop-filter:blur(2px);}
.modal-bg.show{display:flex;}
.modal{background:#fff; border-radius:16px; max-width:420px; width:100%; padding:26px 22px; text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4); animation:pop .3s ease;}
@keyframes pop{from{opacity:0; transform:scale(.9) translateY(10px);} to{opacity:1; transform:scale(1);}}
.modal .big{font-size:2.6rem; line-height:1; margin-bottom:8px;}
.modal h3{font-size:1.35rem; color:var(--ink); margin-bottom:8px;}
.modal p{font-size:.95rem; line-height:1.5; margin-bottom:8px;}
.modal .assassi{background:var(--vermell-clar); border:1px solid #fca5a5; border-radius:10px; padding:11px; margin:12px 0;
  color:var(--victima); font-weight:700;}
.modal .stats{display:flex; gap:10px; justify-content:center; margin:14px 0;}
.modal .stats div{flex:1; background:#f1f5f9; border-radius:9px; padding:9px;}
.modal .stats .n{font-size:1.2rem; font-weight:900; color:var(--ink);}
.modal .stats .l{font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); font-weight:700;}
.modal button{width:100%; padding:12px; border:0; border-radius:10px; background:var(--blau); color:#fff;
  font:inherit; font-size:.95rem; font-weight:800; cursor:pointer; margin-top:6px;}
.modal button:hover{background:var(--blau-fosc);}
.modal button.sec{background:#e2e8f0; color:var(--ink2);}
.modal .ajuda-txt{text-align:left; font-size:.9rem; line-height:1.6;}
.modal .ajuda-txt li{margin:6px 0 6px 18px;}
.modal .close{position:absolute;}

.confetti{position:fixed; top:-20px; font-size:1.2rem; z-index:80; pointer-events:none; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg); opacity:.2;}}

@media(max-width:720px){
  .wrap{flex-direction:column;}
  .col-joc,.col-info{flex:1 1 auto; width:100%; min-width:0;}
}
footer{background:var(--ink); color:rgba(255,255,255,.55); text-align:center; padding:12px;
  font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-top:auto;}
footer a{color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.3);}
</style>
</head>

   MURDOKU — Gobo26
   Misteri deductiu amb generador de casos de solució única.

/* ---------- Utilitats ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffleR(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function pick(arr,n,rng){return shuffleR(arr.slice(),rng).slice(0,n);}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

/* ---------- Permutacions (cau) ---------- */
const _permCache={};
function permutacions(n){
  if(_permCache[n])return _permCache[n];
  const res=[], a=[]; for(let i=0;i<n;i++)a.push(i);
  (function rec(k){ if(k===n){res.push(a.slice());return;}
    for(let i=k;i<n;i++){[a[k],a[i]]=[a[i],a[k]]; rec(k+1); [a[k],a[i]]=[a[i],a[k]];} })(0);
  _permCache[n]=res; return res;
}

/* ---------- Resolutor: compta solucions fins a un límit ----------
   Una configuració = dues permutacions (rowOf, colOf) sobre els sospitosos.
   Les pistes es divideixen per dependència per podar l'exploració. */
function comptaSolucions(N, clues, limit){
  const perms=permutacions(N);
  const rC=[], cC=[], bC=[];
  for(const c of clues){ if(c.dep==='row')rC.push(c); else if(c.dep==='col')cC.push(c); else bC.push(c); }
  let count=0;
  for(let a=0;a<perms.length;a++){
    const rowOf=perms[a];
    let ok=true;
    for(let x=0;x<rC.length;x++){ if(!rC[x].test(rowOf,null)){ok=false;break;} }
    if(!ok) continue;
    for(let b=0;b<perms.length;b++){
      const colOf=perms[b];
      let ok2=true;
      for(let x=0;x<cC.length;x++){ if(!cC[x].test(null,colOf)){ok2=false;break;} }
      if(!ok2) continue;
      for(let x=0;x<bC.length;x++){ if(!bC[x].test(rowOf,colOf)){ok2=false;break;} }
      if(!ok2) continue;
      count++;
      if(count>=limit) return count;
    }
  }
  return count;
}

/* ---------- Format de noms i posicions (català) ---------- */
function artCap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function nomCap(s){ return s.art==="l'" ? "L'"+s.nom : artCap(s.art)+" "+s.nom; }
function nomMin(s){ return s.art==="l'" ? "l'"+s.nom : s.art+" "+s.nom; }
function filaText(r,N){ if(r===0)return "a la fila de més amunt"; if(r===N-1)return "a la fila de més avall"; return "a la fila "+(r+1)+" (comptant des de dalt)"; }
function colText(c,N){ if(c===0)return "a la columna de més a l'esquerra"; if(c===N-1)return "a la columna de més a la dreta"; return "a la columna "+(c+1)+" (des de l'esquerra)"; }

/* ---------- Construcció de pistes candidates (totes certes per a la solució) ---------- */
function construirPistes(S, rowSol, colSol, N, rooms, victimIdx, difKey){
  const P=[];
  const cell=(r,c)=>r*N+c;
  const rn=idx=>rooms[idx][1];
  const add=(t,dep,test,w)=>P.push({t,dep,test,w});
  // Absolutes (sempre al pool: garanteixen unicitat assolible)
  for(let i=0;i<N;i++){
    add(`${nomCap(S[i])} és ${filaText(rowSol[i],N)}.`,'row',(ro)=>ro[i]===rowSol[i],1);
    add(`${nomCap(S[i])} és ${colText(colSol[i],N)}.`,'col',(ro,co)=>co[i]===colSol[i],1);
  }
  // Relatives simples
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){ if(i===j)continue;
    if(rowSol[i]<rowSol[j]) add(`${nomCap(S[i])} és en una fila més amunt que ${nomMin(S[j])}.`,'row',(ro)=>ro[i]<ro[j],2);
    if(colSol[i]<colSol[j]) add(`${nomCap(S[i])} és més a l'esquerra que ${nomMin(S[j])}.`,'col',(ro,co)=>co[i]<co[j],2);
    if(rowSol[j]===rowSol[i]+1) add(`${nomCap(S[i])} és just a la fila de sobre de ${nomMin(S[j])}.`,'row',(ro)=>ro[j]===ro[i]+1,2);
    if(colSol[j]===colSol[i]+1) add(`${nomCap(S[i])} és just a la columna de l'esquerra de ${nomMin(S[j])}.`,'col',(ro,co)=>co[j]===co[i]+1,2);
  }
  // Habitació exacta (referència temàtica). No revelem l'habitació de la víctima.
  for(let i=0;i<N;i++){ const idx=cell(rowSol[i],colSol[i]); if(idx===victimIdx)continue;
    add(`${nomCap(S[i])} es troba a «${rn(idx)}».`,'both',(ro,co)=>ro[i]===rowSol[i]&&co[i]===colSol[i],2); }
  // Mateixa fila / columna que una habitació coneguda
  for(let i=0;i<N;i++){
    for(let c=0;c<N;c++){ if(c===colSol[i])continue; const idx=cell(rowSol[i],c); if(idx===victimIdx)continue;
      add(`${nomCap(S[i])} és a la mateixa fila que «${rn(idx)}».`,'row',(ro)=>ro[i]===rowSol[i],2); break; }
    for(let r=0;r<N;r++){ if(r===rowSol[i])continue; const idx=cell(r,colSol[i]); if(idx===victimIdx)continue;
      add(`${nomCap(S[i])} és a la mateixa columna que «${rn(idx)}».`,'col',(ro,co)=>co[i]===colSol[i],2); break; }
  }
  if(difKey!=='facil'){
    // Diagonals
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){ if(i===j)continue;
      if(rowSol[i]<rowSol[j]&&colSol[i]<colSol[j]) add(`${nomCap(S[i])} és més amunt i més a l'esquerra que ${nomMin(S[j])}.`,'both',(ro,co)=>ro[i]<ro[j]&&co[i]<co[j],3);
      if(rowSol[i]<rowSol[j]&&colSol[i]>colSol[j]) add(`${nomCap(S[i])} és més amunt i més a la dreta que ${nomMin(S[j])}.`,'both',(ro,co)=>ro[i]<ro[j]&&co[i]>co[j],3);
    }
    // Cantonades
    for(let i=0;i<N;i++){ if((rowSol[i]===0||rowSol[i]===N-1)&&(colSol[i]===0||colSol[i]===N-1))
      add(`${nomCap(S[i])} és en una de les quatre cantonades de la sala.`,'both',(ro,co)=>(ro[i]===0||ro[i]===N-1)&&(co[i]===0||co[i]===N-1),3); }
    // Entre (columnes)
    for(let i=0;i<N;i++){ let L=-1,R=-1; for(let j=0;j<N;j++){ if(j===i)continue; if(colSol[j]<colSol[i]&&L<0)L=j; if(colSol[j]>colSol[i]&&R<0)R=j; }
      if(L>=0&&R>=0) add(`Per columnes, ${nomMin(S[i])} és entre ${nomMin(S[L])} i ${nomMin(S[R])}.`,'col',(ro,co)=>Math.min(co[L],co[R])<co[i]&&co[i]<Math.max(co[L],co[R]),3); }
  }
  // Negacions (farciment fàcil)
  for(let i=0;i<N;i++){ const x=(rowSol[i]+1)%N; if(x!==rowSol[i]) add(`${nomCap(S[i])} NO és ${filaText(x,N)}.`,'row',(ro)=>ro[i]!==x,1); }
  return P;
}

/* ---------- Generació d'un cas amb solució única ---------- */
function generarCas(difKey, rng, isDaily){
  const N=DIFS[difKey].N;
  const scen=SCENARIS[Math.floor(rng()*SCENARIS.length)];
  const S=pick(scen.suspects,N,rng);
  const rooms=pick(scen.rooms,N*N,rng);
  const rowSol=shuffleR(Array.from({length:N},(_,i)=>i),rng);
  const colSol=shuffleR(Array.from({length:N},(_,i)=>i),rng);
  const killer=Math.floor(rng()*N);
  const victimIdx=rowSol[killer]*N+colSol[killer];

  const pool=construirPistes(S,rowSol,colSol,N,rooms,victimIdx,difKey);
  shuffleR(pool,rng);

  // Selecciona pistes fins a unicitat
  let sel=[];
  for(const c of pool){ if(comptaSolucions(N,sel,2)===1)break; sel.push(c); }
  if(comptaSolucions(N,sel,2)!==1) sel=pool.slice();
  // Poda redundants
  let changed=true;
  while(changed){ changed=false;
    for(let i=0;i<sel.length;i++){ const w=sel.slice(0,i).concat(sel.slice(i+1));
      if(comptaSolucions(N,w,2)===1){ sel=w; changed=true; break; } } }
  // Fàcil: una mica de redundància amable
  if(difKey==='facil'){ const extra=pool.filter(c=>sel.indexOf(c)<0&&c.w<=2); shuffleR(extra,rng); sel=sel.concat(extra.slice(0,2)); }
  shuffleR(sel,rng);

  const victima=pick(scen.victims,1,rng)[0];
  const weapon=pick(scen.weapons,1,rng)[0];
  return { scenId:scen.id, titol:scen.titol, accent:scen.accent, difKey, N,
    rooms, rowSol, colSol, killer, victimIdx,
    suspects:S, clues:sel.map(c=>c.t), victima, weapon, isDaily:!!isDaily };
}

const G={ cas:null, placement:{}, sel:null, elapsed:0, timerId:null, running:false, so:true };

const $=id=>document.getElementById(id);

function so(freq,dur,type,vol){
  if(!G.so)return;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    G._ac=G._ac||new AC(); const ac=G._ac; const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(vol||0.08,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(dur||0.15));
    o.start(); o.stop(ac.currentTime+(dur||0.15)); }catch(e){}
}
function vibra(ms){ if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){} }
function toast(msg,tipus){ const t=$('toast'); t.textContent=msg; t.className='show'+(tipus?' '+tipus:''); clearTimeout(G._toast); G._toast=setTimeout(()=>t.className='',2200); }

function toggleSo(){ G.so=!G.so; lsSet('murdoku_so',G.so); $('btn-so').textContent=G.so?'🔊':'🔇'; if(G.so)so(660,0.1); }

/* ---------- Temporitzador ---------- */
function tempsFmt(s){ const m=Math.floor(s/60), x=s%60; return (m<10?'0':'')+m+':'+(x<10?'0':'')+x; }
function arrencaTimer(){ para=false; if(G.timerId)clearInterval(G.timerId); G.running=true;
  $('timer').textContent=tempsFmt(G.elapsed);
  G.timerId=setInterval(()=>{ if(document.hidden)return; G.elapsed++; $('timer').textContent=tempsFmt(G.elapsed); guarda(); },1000); }
function paraTimer(){ G.running=false; if(G.timerId){clearInterval(G.timerId);G.timerId=null;} }

  const c=G.cas; if(!c)return;
  // dossier
  const victRoom=c.rooms[c.victimIdx][1];

  $('cas-titol').textContent=c.titol;
  const mort=c.victima.g==='m'?'mort':'morta';
  $('cas-text').innerHTML=`Han trobat <b>${c.victima.n}</b> sense vida a <b>«${victRoom}»</b>. `+
    `Hi havia <b>${c.N} sospitosos</b>, cadascun en una habitació diferent (un per fila i un per columna). `+
    `L'assassí és qui comparteix habitació amb la víctima. Col·loca'ls tots seguint les pistes.`;
  $('cas-arma').innerHTML=`🔪 Arma del crim: <b>${c.weapon}</b>`;
  // botons dif
  document.querySelectorAll('.controls [data-dif]').forEach(b=>b.classList.toggle('actiu', b.dataset.dif===c.difKey && !c.isDaily));
  // board
  const N=c.N, b=$('board');
  b.className='board n'+N; b.style.gridTemplateColumns='repeat('+N+',1fr)';
  b.innerHTML='';
  const occ={}; // cellIdx -> suspectIndex
  for(const k in G.placement) occ[G.placement[k]]=+k;
  for(let idx=0;idx<N*N;idx++){
    const r=Math.floor(idx/N), col=idx%N;
    const d=document.createElement('div'); d.className='cel'+(idx===c.victimIdx?' victima':'');
    d.dataset.idx=idx;
    const room=c.rooms[idx];
    d.innerHTML=`<div class="room-ic">${room[0]}</div><div class="room-nom">${room[1]}</div>`+
      (idx===c.victimIdx?`<div class="cos">💀</div>`:'');
    if(occ[idx]!=null){ const s=c.suspects[occ[idx]];
      const av=document.createElement('div'); av.className='avatar'; av.style.background=s.color; av.textContent=s.nom[0];
      d.appendChild(av); }
    if(G.sel!=null){ /* destaca res */ }
    d.onclick=()=>clicCella(idx);
    b.appendChild(d);
  }
  updateConflictes();
  renderTray();
  renderPistes();
  renderRecords();
}
function renderTray(){
  const c=G.cas, t=$('tray'); t.innerHTML='';
  c.suspects.forEach((s,i)=>{
    const colocat=G.placement[i]!=null;
    const el=document.createElement('button'); el.className='chip'+(G.sel===i?' sel':'')+(colocat?' colocat':'');
    el.innerHTML=`<span class="av" style="background:${s.color}">${s.nom[0]}</span><span class="em">${s.emoji}</span><span class="nom">${nomCap(s)}</span>`;
    el.onclick=()=>clicSospitos(i);
    t.appendChild(el);
  });
}
function renderPistes(){
  const c=G.cas, ol=$('clues'); ol.innerHTML='';
  c.clues.forEach((txt,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="num">${i+1}</span><span>${txt}</span>`;
    ol.appendChild(li);
  });
}
function renderRecords(){
  const rec=lsGet('murdoku_records',{}), diari=lsGet('murdoku_diari',{});
  const cur=rec[G.cas.difKey]||{};
  const wrap=$('records');
  wrap.innerHTML=
    `<div class="rec-card"><div class="n">${cur.best?tempsFmt(cur.best):'—'}</div><div class="l">Millor ${DIFS[G.cas.difKey].nom}</div></div>`+
    `<div class="rec-card"><div class="n">${cur.solved||0}</div><div class="l">Resolts ${DIFS[G.cas.difKey].nom}</div></div>`+
    `<div class="rec-card"><div class="n">${diari.ratxa||0} 🔥</div><div class="l">Ratxa diària</div></div>`;
}

function updateConflictes(){
  const c=G.cas, N=c.N;
  const rowUse={}, colUse={};
  for(const k in G.placement){ const idx=G.placement[k]; const r=Math.floor(idx/N), col=idx%N;
    (rowUse[r]=rowUse[r]||[]).push(idx); (colUse[col]=colUse[col]||[]).push(idx); }
  document.querySelectorAll('.cel').forEach(cel=>{
    const idx=+cel.dataset.idx, r=Math.floor(idx/N), col=idx%N;
    const occupada=Object.values(G.placement).indexOf(idx)>=0;
    const conf=occupada && ((rowUse[r]&&rowUse[r].length>1)||(colUse[col]&&colUse[col].length>1));
    cel.classList.toggle('conflicte',!!conf);
  });
}

/* ---------- Interacció ---------- */
function clicSospitos(i){ G.sel=(G.sel===i?null:i); renderTray(); actualitzaHint(); }
function actualitzaHint(){
  $('tray-hint').textContent = G.sel!=null ? 'Ara toca una habitació per col·locar-hi '+nomCap(G.cas.suspects[G.sel]) : "Tria'n un i toca una habitació";
}
function clicCella(idx){
  const c=G.cas;
  const ocupantActual=Object.keys(G.placement).find(k=>G.placement[k]===idx);
  if(G.sel==null){
    if(ocupantActual!=null){ G.sel=+ocupantActual; renderTray(); actualitzaHint(); so(520,0.06); }
    return;
  }
  // Si el sospitós seleccionat ja és aquí -> recull
  if(G.placement[G.sel]===idx){ delete G.placement[G.sel]; so(400,0.07,'sine'); }
  else{
    // desplaça l'ocupant previ (si n'hi ha)
    if(ocupantActual!=null) delete G.placement[ocupantActual];
    G.placement[G.sel]=idx; so(660,0.07,'triangle');
  }
  G.sel=null;
  vibra(12);
  render(); actualitzaHint(); guarda();
  comprovaVictoria();
}

function treuTot(){
  if(Object.keys(G.placement).length===0)return;
  G.placement={}; G.sel=null; render(); actualitzaHint(); guarda(); so(300,0.12,'sawtooth');
}

function donaPista(){
  const c=G.cas;
  // busca un sospitós no col·locat correctament
  const cands=[];
  for(let i=0;i<c.N;i++){ const correcte=c.rowSol[i]*c.N+c.colSol[i]; if(G.placement[i]!==correcte)cands.push(i); }
  if(cands.length===0){ toast('Ja ho tens tot ben col·locat! 🎉'); return; }
  const i=cands[Math.floor(Math.random()*cands.length)];
  const idx=c.rowSol[i]*c.N+c.colSol[i];
  // treu qui hi hagués
  const prev=Object.keys(G.placement).find(k=>G.placement[k]===idx); if(prev!=null)delete G.placement[prev];
  G.placement[i]=idx; G.sel=null;
  render(); guarda(); so(880,0.1,'triangle');
  const cel=document.querySelector('.cel[data-idx="'+idx+'"]'); if(cel){cel.classList.add('correcte-flash'); setTimeout(()=>cel.classList.remove('correcte-flash'),700);}
  toast('💡 Pista: '+nomCap(c.suspects[i])+' va a «'+c.rooms[idx][1]+'»');
  comprovaVictoria();
}

function esSolucio(){
  const c=G.cas;
  if(Object.keys(G.placement).length!==c.N)return false;
  for(let i=0;i<c.N;i++){ if(G.placement[i]!==c.rowSol[i]*c.N+c.colSol[i])return false; }
  return true;
}
function comprova(){
  const c=G.cas, posats=Object.keys(G.placement).length;
  if(posats<c.N){ toast('Encara et falten '+(c.N-posats)+' sospitós(os) per col·locar.'); so(300,0.12,'sawtooth'); return; }
  if(esSolucio()) guanyar();
  else{ toast('Hi ha alguna cosa que no encaixa amb les pistes. 🤔','err'); so(200,0.18,'sawtooth'); vibra([20,40,20]); }
}
function comprovaVictoria(){ if(esSolucio())guanyar(); }

function guanyar(){
  if(G._guanyat)return; G._guanyat=true;
  paraTimer();
  const c=G.cas;
  const idx=c.rowSol[c.killer]*c.N+c.colSol[c.killer];
  const celKiller=document.querySelector('.cel[data-idx="'+idx+'"]'); if(celKiller)celKiller.classList.add('correcte-flash');
  so(660,0.12,'triangle'); setTimeout(()=>so(880,0.12,'triangle'),130); setTimeout(()=>so(1180,0.2,'triangle'),260);
  vibra([30,50,30,50,80]); confeti();
  // rècords
  let novaRatxa=null, nouBest=false;
  const rec=lsGet('murdoku_records',{}); const cur=rec[c.difKey]||{best:null,solved:0};
  cur.solved=(cur.solved||0)+1;
  if(cur.best==null||G.elapsed<cur.best){ cur.best=G.elapsed; nouBest=true; }
  rec[c.difKey]=cur; lsSet('murdoku_records',rec);
  if(c.isDaily){
    const diari=lsGet('murdoku_diari',{}); const avui=dataAvui();
    if(diari.data!==avui){
      diari.ratxa = (diari.data===dataAhir()) ? (diari.ratxa||0)+1 : 1;
      diari.data=avui; diari.fet=true; if(diari.best==null||G.elapsed<diari.best)diari.best=G.elapsed;
      lsSet('murdoku_diari',diari); novaRatxa=diari.ratxa;
    } else novaRatxa=diari.ratxa;
  }
  lsDel('murdoku_partida');
  const k=c.suspects[c.killer];
  let extra='';
  if(c.isDaily) extra=`<p>Ratxa del repte diari: <b>${novaRatxa} dia(es) seguits 🔥</b></p>`;
  else if(nouBest) extra=`<p>🏅 <b>Nou rècord de temps</b> en nivell ${DIFS[c.difKey].nom}!</p>`;
  obreModal(`
    <div class="big">🕵️‍♂️</div>
    <h3>Cas resolt!</h3>
    <div class="assassi">🔪 L'assassí és <b>${nomCap(k)}</b>,<br>enxampat a «${c.rooms[idx][1]}» amb ${c.weapon}.</div>
    <div class="stats">
      <div><div class="n">${tempsFmt(G.elapsed)}</div><div class="l">Temps</div></div>
      <div><div class="n">${c.clues.length}</div><div class="l">Pistes</div></div>
    </div>
    ${extra}
    <button onclick="tancaModal();casNou()">🔄 Un altre cas</button>
    <button class="sec" onclick="tancaModal()">Tancar</button>
  `);
}

/* ---------- Confeti ---------- */
function confeti(){ const ems=['🎉','🔎','🕵️','✨','🔦','📌']; for(let i=0;i<26;i++){ const s=document.createElement('div'); s.className='confetti'; s.textContent=ems[i%ems.length]; s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(1.6+Math.random()*1.4)+'s'; s.style.animationDelay=(Math.random()*0.4)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),3400); } }

/* ---------- Modal ---------- */
function obreModal(html){ $('modal').innerHTML=html; $('modal-bg').classList.add('show'); }
function tancaModal(){ $('modal-bg').classList.remove('show'); }
$('modal-bg').addEventListener('click',e=>{ if(e.target===$('modal-bg'))tancaModal(); });
function obreAjuda(){
  obreModal(`
    <div class="big">🔪</div>
    <h3>Com es juga al Murdoku</h3>
    <ul class="ajuda-txt">
      <li>Hi ha una víctima en una habitació marcada amb 💀 i uns quants sospitosos.</li>
      <li>Cada sospitós ocupa una habitació: <b>un per cada fila i un per cada columna</b> (com un sudoku).</li>
      <li>Toca un <b>sospitós</b> i després l'<b>habitació</b> on el vols posar. Si dos comparteixen fila o columna, es marquen en <b>vermell</b>.</li>
      <li>Fes servir les <b>pistes</b> per deduir on va cadascú. Sempre hi ha una única solució possible.</li>
      <li>L'<b>assassí</b> és qui acaba a l'habitació de la víctima. Col·loca'ls tots correctament per resoldre el cas!</li>
    </ul>
    <button onclick="tancaModal()">Entesos</button>
  `);
}

/* ---------- Data / persistència ---------- */
function dataAvui(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dataAhir(){ const d=new Date(Date.now()-86400000); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function seedData(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }

function guarda(){ if(G._guanyat||!G.cas)return; lsSet('murdoku_partida',{cas:G.cas, placement:G.placement, elapsed:G.elapsed}); }
function restaura(){
  const p=lsGet('murdoku_partida',null); if(!p||!p.cas)return false;
  G.cas=p.cas; G.placement=p.placement||{}; G.elapsed=p.elapsed||0; G._guanyat=false; G.sel=null;
  render(); actualitzaHint(); arrencaTimer(); return true;
}

/* ---------- Iniciar casos ---------- */
function novaPartida(cas){
  paraTimer(); G.cas=cas; G.placement={}; G.sel=null; G.elapsed=0; G._guanyat=false;
  render(); actualitzaHint(); arrencaTimer(); guarda();
}
let difActual='mitja';
function triaDif(dif){ difActual=dif; comencaAmbConfirmacio(()=>novaPartida(generarCas(dif, mulberry32((Math.random()*4294967296)>>>0), false))); }
function casNou(){ const dif=(G.cas&&!G.cas.isDaily)?G.cas.difKey:difActual; comencaAmbConfirmacio(()=>novaPartida(generarCas(dif, mulberry32((Math.random()*4294967296)>>>0), false))); }
function jugaDiari(){
  const diari=lsGet('murdoku_diari',{});
  const genera=()=>novaPartida(generarCas('mitja', mulberry32(seedData()), true));
  if(diari.data===dataAvui() && diari.fet){
    obreModal(`<div class="big">📅</div><h3>Repte del dia</h3><p>Ja l'has resolt avui! Ratxa actual: <b>${diari.ratxa||0} 🔥</b></p><p>Vols tornar-lo a jugar (no compta per la ratxa)?</p><button onclick="tancaModal();(${genera.toString()})()">Tornar a jugar</button><button class="sec" onclick="tancaModal()">Deixar-ho estar</button>`);
    return;
  }
  comencaAmbConfirmacio(genera);
}
function comencaAmbConfirmacio(fn){
  const enJoc = G.cas && !G._guanyat && Object.keys(G.placement).length>0;
  if(enJoc){
    obreModal(`<div class="big">⚠️</div><h3>Descartar el cas actual?</h3><p>Tens un cas a mig resoldre. Si en comences un de nou, perdràs el progrés d'aquest.</p><button onclick="tancaModal();window._contFn&&window._contFn()">Sí, cas nou</button><button class="sec" onclick="tancaModal()">Continuar l'actual</button>`);
    window._contFn=fn;
  } else fn();
}

/* ---------- Arrencada ---------- */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && G.cas && !G._guanyat && !G.running) arrencaTimer(); });
window.addEventListener('load',()=>{
  G.so=lsGet('murdoku_so',true); $('btn-so').textContent=G.so?'🔊':'🔇';
  if(!restaura()){ novaPartida(generarCas('mitja', mulberry32((Math.random()*4294967296)>>>0), false)); }
});
</script>
</body>
</html>
