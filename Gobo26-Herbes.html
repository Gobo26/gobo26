<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herbes mediterrànies – Gobo26</title>
<meta name="description" content="Herbes mediterrànies: guia, tradicions i curiositats sobre plantes i usos populars.">
<meta name="theme-color" content="#1e293b">
  <style>
    :root {
      --s800: #1e293b;
      --s700: #334155;
      --s600: #475569;
      --s400: #94a3b8;
      --s200: #e2e8f0;
      --s100: #f1f5f9;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--s100);
      color: var(--s800);
      min-height: 100vh;
    }

    /* HEADER */
    header{width:100%;background:#1e293b;border-bottom:1px solid #334155;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0;}
    .logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
    .logo-txt{font-size:1rem;font-weight:900;color:white;letter-spacing:-0.5px;}
    .logo-txt span{color:#3b82f6;}
    .hdr-title{font-size:.95rem;font-weight:700;color:white;letter-spacing:.5px;}

    /* ORACLE */
    .oracle-section {
      background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
      padding: 36px 20px;
      text-align: center;
      color: white;
    }

    .oracle-section h2 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }

    .oracle-subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 26px;
    }

    .oracle-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 420px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      display: none;
    }

    .oracle-card.visible {
      display: block;
      animation: popIn 0.4s ease;
    }

    .oracle-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 10px;
    }

    .oracle-herb-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--s800);
      margin-bottom: 2px;
    }

    .oracle-herb-sci {
      font-size: 0.8rem;
      color: var(--s600);
      font-style: italic;
      margin-bottom: 16px;
    }

    .oracle-message {
      font-size: 1.05rem;
      color: var(--s700);
      line-height: 1.6;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .oracle-suggestion {
      font-size: 0.9rem;
      color: var(--s600);
      line-height: 1.55;
      background: var(--s100);
      border-radius: 10px;
      padding: 12px 14px;
      font-style: italic;
    }

    .btn-oracle {
      background: white;
      color: #065f46;
      border: none;
      padding: 15px 32px;
      border-radius: 50px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-oracle:hover { transform: scale(1.04); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .btn-oracle:active { transform: scale(0.97); }

    /* SAVIESA */
    .saviesa-section {
      background: linear-gradient(135deg, #fef9c3, #fef08a);
      padding: 26px 20px;
      text-align: center;
    }

    .saviesa-section h3 {
      font-size: 0.75rem;
      font-weight: 700;
      color: #92400e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .saviesa-quote {
      font-size: 1.1rem;
      color: #78350f;
      font-style: italic;
      font-weight: 600;
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 16px;
      min-height: 2.4em;
    }

    .saviesa-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-sav {
      background: #92400e;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sav:hover { background: #78350f; }

    /* CATALOG */
    .catalog-section {
      padding: 28px 16px 40px;
      max-width: 960px;
      margin: 0 auto;
    }

    .catalog-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .catalog-top h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--s800);
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .ftab {
      padding: 7px 14px;
      border-radius: 50px;
      border: 2px solid var(--s200);
      background: white;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      color: var(--s600);
    }

    .ftab.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .cercador {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid var(--s200);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: .95rem;
      color: var(--s800);
      background: white;
      outline: none;
      margin-bottom: 8px;
    }
    .cercador:focus { border-color: var(--blue); }

    .plant-count {
      font-size: .78rem;
      color: var(--s400);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .plant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 13px;
    }

    .plant-card {
      background: white;
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
    }

    .plant-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .plant-card:active { transform: translateY(-1px); }

    .pc-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
    }

    .plant-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--s800);
      margin-bottom: 4px;
    }

    .plant-sci {
      font-size: 0.68rem;
      color: var(--s400);
      font-style: italic;
      margin-bottom: 8px;
    }

    .cat-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 50px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Category colours */
    .cat-aromatica .pc-icon { background: #d1fae5; }
    .cat-aromatica .cat-badge { background: #d1fae5; color: #065f46; }

    .cat-cuina .pc-icon { background: #fef3c7; }
    .cat-cuina .cat-badge { background: #fef3c7; color: #92400e; }

    .cat-calmant .pc-icon { background: #ede9fe; }
    .cat-calmant .cat-badge { background: #ede9fe; color: #5b21b6; }

    .cat-especia .pc-icon { background: #ffe4e6; }
    .cat-especia .cat-badge { background: #ffe4e6; color: #9f1239; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      background: white;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 580px;
      max-height: 92vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    .modal-hdr {
      padding: 22px 22px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      background: white;
      border-bottom: 1px solid var(--s200);
      z-index: 10;
    }

    .m-emoji { font-size: 4rem; display: block; margin-bottom: 6px; }

    .m-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--s800);
      margin-bottom: 2px;
    }

    .m-sci {
      font-size: 0.82rem;
      color: var(--s600);
      font-style: italic;
      margin-bottom: 3px;
    }

    .m-family { font-size: 0.72rem; color: var(--s400); }

    .m-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--s100);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      color: var(--s600);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .m-close:hover { background: var(--s200); }

    .modal-body { padding: 18px 22px 36px; }

    .info-block { margin-bottom: 20px; }

    .info-block h4 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-block p {
      font-size: 0.97rem;
      line-height: 1.72;
      color: var(--s700);
    }

    .ritual-box {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border-radius: 14px;
      padding: 16px;
      border-left: 4px solid var(--green);
    }

    .r-step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 9px;
    }

    .r-step:last-child { margin-bottom: 0; }

    .r-num {
      background: var(--green);
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .r-text {
      font-size: 0.92rem;
      color: var(--s700);
      line-height: 1.55;
    }

    .disclaimer {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.78rem;
      color: #9a3412;
      text-align: center;
      line-height: 1.55;
      margin-top: 20px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 22px 20px;
      font-size: 0.75rem;
      color: var(--s400);
    }

    /* ANIMATIONS */
    @keyframes popIn {
      0%   { transform: scale(0.8); opacity: 0; }
      65%  { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(80px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .plant-grid { grid-template-columns: repeat(2, 1fr); }
      .oracle-section h2 { font-size: 1.25rem; }
      header h1 { font-size: 1rem; }
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">

// ─────────────────────────────────────────────
// ESTAT
// ─────────────────────────────────────────────
var saviesaIdx = 0;
var ultimaOracleId = null;

var CAT_LABELS = {
  aromatica: 'Aromàtica',
  cuina: 'Cuina',
  calmant: 'Calmant',
  especia: 'Espècia'
};

// ─────────────────────────────────────────────
// ORACLE
// ─────────────────────────────────────────────
function showOracle() {
  var candidats = PLANTES.filter(function(p) { return p.id !== ultimaOracleId; });
  var p = candidats[Math.floor(Math.random() * candidats.length)];
  ultimaOracleId = p.id;

  document.getElementById('oEmoji').textContent = p.emoji;
  document.getElementById('oNom').textContent = p.nom;
  document.getElementById('oSci').textContent = p.nomCientific;
  document.getElementById('oMsg').textContent = '🌿 ' + p.oracleMsg;
  document.getElementById('oSug').textContent = p.oracleSug;

  var card = document.getElementById('oracleCard');
  card.classList.remove('visible');
  void card.offsetWidth; // reflow per reiniciar l'animació
  card.classList.add('visible');

  document.getElementById('btnOracle').textContent = '🔮 Consultar de nou';
}

// ─────────────────────────────────────────────
// SAVIESA
// ─────────────────────────────────────────────
function initSaviesa() {
  saviesaIdx = Math.floor(Math.random() * SAVIESES.length);
  renderSaviesa();
}

function renderSaviesa() {
  document.getElementById('saviesaText').textContent = SAVIESES[saviesaIdx];
}

function moveSaviesa(dir) {
  saviesaIdx = (saviesaIdx + dir + SAVIESES.length) % SAVIESES.length;
  renderSaviesa();
}

// ─────────────────────────────────────────────
// CATÀLEG
// ─────────────────────────────────────────────
var catActual = 'all';

function normalitzar(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function renderPlants() {
  var text = normalitzar(document.getElementById('cercador').value || '');
  var llista = PLANTES.filter(function(p) {
    var okCat = catActual === 'all' || p.categoria === catActual;
    var okText = !text || normalitzar(p.nom + ' ' + p.nomCientific).indexOf(text) !== -1;
    return okCat && okText;
  });

  document.getElementById('plantCount').textContent = llista.length === PLANTES.length
    ? PLANTES.length + ' plantes a la guia'
    : llista.length + ' de ' + PLANTES.length + ' plantes';

  document.getElementById('plantGrid').innerHTML = llista.length === 0
    ? '<p style="grid-column:1/-1;color:var(--s400);font-size:.9rem;">Cap planta no coincideix amb la cerca.</p>'
    : llista.map(function(p) {
        return '<div class="plant-card cat-' + p.categoria + '" onclick="obrirModal(\'' + p.id + '\')">' +
          '<div class="pc-icon"><span>' + p.emoji + '</span></div>' +
          '<div class="plant-name">' + p.nom + '</div>' +
          '<div class="plant-sci">' + p.nomCientific + '</div>' +
          '<span class="cat-badge">' + (CAT_LABELS[p.categoria] || p.categoria) + '</span>' +
          '</div>';
      }).join('');
}

function filtrar(cat, btn) {
  document.querySelectorAll('.ftab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  catActual = cat;
  renderPlants();
}

// ─────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────
function obrirModal(id) {
  var p = null;
  for (var i = 0; i < PLANTES.length; i++) {
    if (PLANTES[i].id === id) { p = PLANTES[i]; break; }
  }
  if (!p) return;

  document.getElementById('mEmoji').textContent  = p.emoji;
  document.getElementById('mTitle').textContent  = p.nom;
  document.getElementById('mSci').textContent    = p.nomCientific;
  document.getElementById('mFamily').textContent = 'Família: ' + p.familia;

  var passos = p.ritual.map(function(s, i) {
    return '<div class="r-step">' +
      '<div class="r-num">' + (i + 1) + '</div>' +
      '<div class="r-text">' + s + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('mBody').innerHTML =
    '<div class="info-block">' +
      '<h4 style="color:#065f46">📍 On es troba</h4>' +
      '<p>' + p.on + '</p>' +
    '</div>' +
    '<div class="info-block">' +
      '<h4 style="color:#1d4ed8">🔬 Fitoteràpia tradicional</h4>' +
      '<p>' + p.info + '</p>' +
    '</div>' +
    '<div class="info-block">' +
      '<h4 style="color:#7c3aed">🌙 Tradició popular</h4>' +
      '<p>' + p.tradicio + '</p>' +
    '</div>' +
    '<div class="info-block">' +
      '<h4 style="color:#16a34a">✨ Ritual simpàtic</h4>' +
      '<div class="ritual-box">' + passos + '</div>' +
    '</div>' +
    '<div class="disclaimer">' +
      '⚠️ <strong>Nota important:</strong> Aquesta informació és exclusivament cultural i divulgativa. ' +
      'No constitueix consell mèdic ni substitueix l\'assessorament de professionals de la salut.' +
    '</div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function tancarModal(event) {
  if (!event || event.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
}

// ─────────────────────────────────────────────
// INICIALITZACIÓ
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  initSaviesa();
  renderPlants();
});
</script>
